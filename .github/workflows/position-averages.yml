# Football Week：毎晩、5大リーグの「ポジション別の平均的な選手」を計算して data/position-averages.json を更新する
# （選手ページの「同じポジションの平均との比較」の横棒に使う）。
# 日本時間の朝5時ごろ（欧州の試合が終わった後）に自動で動く。GitHubの「Actions」タブから手動でも動かせる。
name: position-averages

on:
  schedule:
    - cron: '0 20 * * *'   # 毎日 20:00 UTC ＝ 日本時間 5:00
  workflow_dispatch:

permissions:
  contents: write          # 計算結果のファイルをリポジトリに保存するため

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute position averages
        run: python tools/position_averages.py
      - name: Count goals by foot
        run: python tools/goal_feet.py
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/position-averages.json data/goal-feet.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update position averages"
            git push
          fi
