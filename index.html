  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0f172a;
      --indigo:  #4f46e5;
      --ind2:    #3730a3;
      --bg:      #f1f5f9;
      --white:   #ffffff;
      --row-alt: #f8fafc;
      --row-hl:  #eef2ff;
      --text:    #0f172a;
      --muted:   #64748b;
      --border:  #e2e8f0;
      --live:    #dc2626;
      --fin:     #64748b;
      --hdr:     52px;
      --nav:     42px;
    }

    /* iOS Safari対策（2026-06-12に解決済みの内容を復元）:
       - html に背景色を敷く：無指定だとSafariの一番上（ステータスバー周り）が灰色/白の帯になる
       - text-size-adjust:100%：iOSが文字を勝手に拡大するのを止める（拡大されると1画面の試合数が減る）
       - body に background-attachment: fixed を付けない：Safariのバー表示を壊す主犯 */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #c8e6f7; }
    body {
      font-family: 'M PLUS 1p', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #c8e6f7 0%, #dff0f8 35%, #cceef5 70%, #d4eef9 100%);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* iOS 26以降のSafari専用：画面最上部の「もや」対策。
       新しいSafariは最上部にページ下地色(水色)のぼかしを重ねるため、紺のバナーの上に水色のもやが出る。
       最上部に固定された要素があるとSafariはその色を最上部に使うので、紺の細い帯を置いて紺色を拾わせる。
       古いiOSでは不要かつ副作用の恐れがあるので、html.ios26 が付いた時だけ表示する */
    #iosTopTint { display: none; }
    html.ios26 #iosTopTint {
      display: block; position: fixed; top: 0; left: 0; right: 0; height: 6px;
      background: var(--navy); z-index: 40; pointer-events: none;
    }

    /* ─── Header ─── */
    #topbar {
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: var(--hdr);
      /* 固定しない：スクロールしたらページと一緒に普通に流れる（ユーザー指定） */
      position: static;
      z-index: 30;
    }
    .site-title {
      font-size: 17px; font-weight: 800; letter-spacing: -.4px;
      display: flex; align-items: center; gap: 9px;
      font-family: 'BIZ UDPGothic', sans-serif;
    }
    .site-title em { font-style: normal; }
    .site-logo {
      width: 30px; height: 30px; flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
    }
    .hright { display: flex; align-items: center; gap: 10px; }
    #lastUpdated { font-size: 11px; color: #64748b; white-space: nowrap; transition: color .4s; }
    #lastUpdated.fresh { color: #6ee7b7; }
    #clock { font-size: 12px; color: #94a3b8; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hbtn {
      background: none; border: 1px solid #334155; color: #94a3b8;
      width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, color .15s;
    }
    .hbtn:hover { border-color: #a5b4fc; color: #a5b4fc; }
    #reloadBtn.spin { animation: turn .6s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }

    /* ─── Page nav ─── */
    #pageNav {
      background: var(--navy);
      display: flex;
      padding: 0 20px;
      border-top: 1px solid #1e293b;
      position: static;
      z-index: 29;
      height: var(--nav);
    }
    .pnav {
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      background: none;
      border-top: none; border-left: none; border-right: none;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .pnav:hover  { color: #a5b4fc; }
    .pnav.active { color: #fff; border-bottom-color: var(--indigo); font-weight: 700; }

    /* ─── Secondary filter bar ─── */
    .filter-bar {
      background: rgba(200,234,252,0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(186,230,253,0.6);
      display: flex;
      gap: 4px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      /* スクロールに追従させない（リーグフェーズ/ノックアウトの切替バーが下まで付いてくるのをやめる） */
      position: static;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    /* ─── Dropdown (country / league / scorers) ─── */
    #countryTriggerBtn, #leagueTriggerBtn, #scorersTriggerBtn {
      background: none; border: 1.5px solid var(--indigo); cursor: pointer;
      padding: 4px 12px; border-radius: 14px;
    }
    #countryDropdownOverlay, #leagueDropdownOverlay, #scorersDropdownOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 200; display: none;
    }
    #countryDropdownMenu, #leagueDropdownMenu, #scorersDropdownMenu {
      position: absolute; top: calc(var(--hdr) + var(--nav) + 8px); left: 16px;
      background: #fff; border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.2); overflow: hidden; min-width: 160px;
    }
    .country-opt {
      display: block; width: 100%; padding: 13px 20px;
      font-size: 14px; font-weight: 500; text-align: left;
      background: none; border: none; border-top: 1px solid var(--border);
      cursor: pointer; color: var(--text);
    }
    .country-opt:first-child { border-top: none; }
    .country-opt.active { color: var(--indigo); font-weight: 700; }

    .ftab {
      flex-shrink: 0;
      padding: 10px 14px 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      background: none;
      border-top: none; border-left: none; border-right: none;
      transition: color .15s, border-color .15s;
    }
    .ftab:hover  { color: var(--indigo); }
    .ftab.active { color: var(--indigo); border-bottom-color: var(--indigo); font-weight: 700; }

    /* ─── Content wrapper ─── */
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 56px; }

    /* ─── Section header ─── */
    .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .sec-title { font-size: 13px; font-weight: 700; color: var(--indigo); text-transform: uppercase; letter-spacing: .5px; }
    .sec-cnt { font-size: 11px; background: #e0e7ff; color: var(--indigo); padding: 1px 8px; border-radius: 10px; font-weight: 600; }
    .sec-range { font-size: 12px; color: var(--muted); margin-left: auto; }

    /* ─── Common table ─── */
    .tbl { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 20px; }
    .tbl thead tr { background: #e8eaf6; }
    .tbl thead th { padding: 7px 10px; font-size: 11px; font-weight: 700; color: #3730a3; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
    .tbl thead th.l { text-align: left; }
    .tbl thead th.c { text-align: center; }
    .tbl thead th.r { text-align: right; }
    .tbl tbody tr { border-top: 1px solid var(--border); }
    .tbl tbody tr:nth-child(even) { background: var(--row-alt); }
    .tbl.sched { font-family: 'BIZ UDPMincho', serif; background: rgba(180,225,248,0.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(186,230,253,0.55); box-shadow: 0 4px 28px rgba(8,145,178,0.13), inset 0 1px 0 rgba(255,255,255,0.5); border-collapse: separate; border-spacing: 0 3px; }
    .tbl.sched tbody tr:not(.drow) td { background: rgba(255,255,255,0.62); }
    .tbl.sched td { border-top: 1.5px solid rgba(10,40,80,0.42); border-bottom: 1.5px solid rgba(10,40,80,0.42); }
    .tbl.sched td:first-child { border-left: 1.5px solid rgba(10,40,80,0.42); border-radius: 6px 0 0 6px; }
    .tbl.sched td:last-child  { border-right: 1.5px solid rgba(10,40,80,0.42); border-radius: 0 6px 6px 0; }
    .tbl.sched th { border: none; background: rgba(147,210,240,0.45); }
    .tbl.sched tbody tr:nth-child(even):not(.drow) td { background: rgba(225,242,252,0.65); }
    .tbl.sched tr.drow td { background: rgba(8,145,178,0.28) !important; color: #083d5e !important; border: none !important; letter-spacing: 0.4px !important; font-weight: 800 !important; }

    /* ─── Schedule ─── */
    /* 行のホバー強調は廃止（スマホではタップで発動し、しかも奇数行しか光らず意味不明だった） */
    .tbl.sched { -webkit-tap-highlight-color: transparent; }
    .tbl.sched td { padding: 8px 10px; vertical-align: middle; }
    .tbl tr.drow td { background: #f0f4ff; padding: 5px 10px; font-size: 11px; font-weight: 700; color: #4338ca; border-top: 2px solid #c7d2fe; }
    .tbl tr.drow:first-child td { border-top: none; }
    .th-time { width: 72px; }
    .th-score { width: 66px; }
    /* クラブ名の長さで表の中心（スコア列）がずれる／表が画面より広くなるのを防ぐ（全言語共通）。
       固定レイアウトにするとスコア列以外の2列（ホーム/アウェー）が必ず同じ幅になり、表は必ず画面幅に収まる。
       ※日本語表示を対象外にしていた時期、幅320pxのiPhoneで表が画面をはみ出しバナーより広くなった（2026-09-21実機スクショ） */
    .tbl.sched { table-layout: fixed; width: 100%; }
    .tbl.sched .td-home, .tbl.sched .td-away, .tbl.sched th.r, .tbl.sched th.l { width: auto; }
    .tbl.sched thead th.r, .tbl.sched thead th.l { text-align: center; }
    /* 見出し「SCORE」は列幅より広く、はみ出しが右側にだけ伸びて下のスコアより右にずれていた → 列の中心に文字の中心を合わせる */
    .tbl.sched thead th.th-score { padding-left: 0; padding-right: 0; overflow: visible; }
    .th-sc { display: block; width: max-content; margin-left: 50%; transform: translateX(-50%); }
    /* 英語表示：列に入らないクラブ名の横幅だけを詰める（fitSchedNamesが倍率を設定） */
    .tn-sq { display: inline-block; white-space: nowrap; transform-origin: left center; }
    .th-comp { max-width: 140px; }
    .td-time { width: 72px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .t-pre  { display: inline-block; font-size: 14px; font-weight: 700; color: #fff; font-family: 'BIZ UDPMincho', serif; background: rgba(10,40,80,0.55); border-radius: 6px; padding: 2px 7px; text-shadow: none; }
    .t-pre.late { color: #fff; background: rgba(4,120,87,0.75); }
    .t-fin  { font-size: 12px; font-weight: 500; color: var(--fin); }
    .t-live { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; color: var(--live); }
    .live-dot { width: 12px; height: 12px; background: var(--live); border-radius: 50%; animation: blink 1s ease-in-out infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
    .tbl.sched tr.live-row { background: #fff0f0 !important; }
    .tbl.sched tr.live-row .score-num { color: var(--live); }
    .td-home { text-align: right; padding-right: 4px; font-size: 13px; font-weight: 500; }
    .td-away { text-align: left;  padding-left:  4px; font-size: 13px; font-weight: 500; }
    .tn { color: #0369a1; font-weight: 700; }
    .team-inner { display: inline-flex; align-items: center; gap: 6px; }
    .td-home .team-inner { flex-direction: row-reverse; }
    .badge { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .td-score { width: 66px; text-align: center; font-variant-numeric: tabular-nums; }
    .score-inner { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .score-num { font-size: 16px; font-weight: 800; }
    .score-vs  { font-size: 12px; font-weight: 600; color: var(--muted); }
    .td-comp { max-width: 140px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #scorersPage { font-family: 'BIZ UDPMincho', serif; }
    /* ─── 試合情報ページ（試合日程で行をタップ）。見た目は選手ページと同じ海外風 ─── */
    .tbl.sched tbody tr[data-mid] { cursor: pointer; }
    #matchPage { font-family: 'M PLUS 1p', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mt-hero { color: #fff; border-radius: 18px; padding: 16px 12px 18px; text-align: center;
      background: repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 14px, rgba(255,255,255,0) 14px 28px), linear-gradient(135deg, #0b1220 0%, #14223a 50%, #1f3d66 100%); box-shadow: 0 8px 24px rgba(11,18,32,0.25); }
    .mt-meta { font-size: 12px; font-weight: 700; opacity: .78; letter-spacing: .04em; }
    .mt-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 14px; }
    .mt-team { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; line-height: 1.25; min-width: 0; }
    .mt-team img { width: 58px; height: 58px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }
    .mt-score { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .mt-score small { font-size: 22px; opacity: .6; margin: 0 6px; vertical-align: 6px; }
    .mt-status { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 800; padding: 3px 12px; border-radius: 999px; background: rgba(255,255,255,0.16); }
    .mt-status.live { background: #ef4444; }
    .mt-goals { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 18px; margin-top: 14px; font-size: 12px; line-height: 1.5; }
    .mt-goals > div:first-child { text-align: right; }
    .mt-goals > div:last-child { text-align: left; }
    .mt-sec { background: var(--white); border-radius: 18px; margin-top: 14px; padding: 18px 14px 14px; box-shadow: 0 2px 10px rgba(15,23,42,0.06); }
    .mt-ov { display: block; font-size: 11px; font-weight: 800; letter-spacing: .16em; color: #2563eb; margin-bottom: 2px; }
    .mt-h { font-size: 19px; font-weight: 800; color: #0f172a; margin: 0 0 10px; }
    .mt-stat-hd { display: flex; justify-content: space-between; padding: 0 2px 8px; }
    .mt-stat-hd img { width: 26px; height: 26px; object-fit: contain; }
    .mt-stat { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; padding: 8px 0; border-top: 1px solid #eef1f5; }
    .mt-stat span { text-align: center; font-size: 13px; color: #334155; font-weight: 700; }
    .mt-v { justify-self: start; font-size: 17px; font-weight: 800; color: #0f172a; padding: 3px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }
    .mt-stat .mt-v:last-child { justify-self: end; }
    .mt-v.best { background: var(--tc, #2563eb); color: var(--tt, #fff); }
    .mt-pitch { border-radius: 14px; overflow: hidden; color: #fff; background: repeating-linear-gradient(180deg, #3d9a56 0 46px, #45a35f 46px 92px); }
    .mt-pteam { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-weight: 800; font-size: 15px; background: rgba(0,0,0,0.14); }
    .mt-pteam img { width: 24px; height: 24px; object-fit: contain; background: #fff; border-radius: 5px; padding: 2px; }
    .mt-pteam .mt-form { margin-left: auto; font-size: 13px; background: rgba(255,255,255,0.85); color: #14532d; border-radius: 999px; padding: 3px 11px; }
    .mt-half { position: relative; display: flex; flex-direction: column; gap: 16px; padding: 16px 2px; }
    .mt-half.top { border-bottom: 2px solid rgba(255,255,255,0.7); }
    .mt-half.top::after, .mt-half.bot::before { content: ''; position: absolute; left: 50%; width: 76px; height: 38px; transform: translateX(-50%); border: 2px solid rgba(255,255,255,0.7); }
    .mt-half.top::after { bottom: -2px; border-radius: 76px 76px 0 0; border-bottom: none; }
    .mt-half.bot::before { top: 0; border-radius: 0 0 76px 76px; border-top: none; }
    .mt-line { display: flex; justify-content: space-evenly; align-items: flex-start; position: relative; z-index: 1; }

    .mt-shirt { position: relative; width: 36px; height: 36px; border-radius: 50%; background: var(--sc, #fff); color: var(--st, #0f172a); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-variant-numeric: tabular-nums; }
    .mt-ic { position: absolute; font-size: 10px; line-height: 1; }
    .mt-ic.out { top: -6px; left: -8px; background: #fff; color: #ef4444; border-radius: 999px; padding: 2px 3px; font-weight: 800; font-size: 9px; }
    .mt-ic.g { bottom: -5px; right: -9px; background: #fff; border-radius: 999px; padding: 1px 2px; color: #0f172a; font-weight: 800; }
    .mt-ic.a { bottom: -5px; left: -9px; background: #fff; border-radius: 999px; padding: 1px 2px; }
    .mt-ic.card { top: -5px; right: -6px; width: 9px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px #fff; }
    .mt-yc { background: #facc15; } .mt-rc { background: #ef4444; }
    .mt-nm { margin-top: 9px; font-size: 11px; font-weight: 700; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.55); word-break: keep-all; overflow-wrap: anywhere; }
    .mt-nm b { font-weight: 800; margin-right: 2px; }

    .mt-legend i { font-style: normal; display: inline-block; min-width: 18px; text-align: center; margin-right: 4px; }
    .mt-note { font-size: 13px; color: var(--muted); padding: 6px 0; }
    /* 得点ランキング：背景は全行白（交互の青は不要とユーザー指示 2026-10-22） */
    .tbl.scorers tbody tr, .tbl.scorers tbody tr:nth-child(even) { background: var(--white); }
    /* 順位に応じて行の枠ごと大きく（1位＞2位＞3位＞4位以下）：上下の余白・クラブのマーク・数字 */
    .tbl.scorers tr.rk1 td { padding-top: 10px !important; padding-bottom: 10px !important; }
    .tbl.scorers tr.rk2 td { padding-top: 8px !important; padding-bottom: 8px !important; }
    .tbl.scorers tr.rk3 td { padding-top: 7px !important; padding-bottom: 7px !important; }
    .tbl.scorers tr.rk1 .badge { width: 22px; height: 22px; }
    .tbl.scorers tr.rk2 .badge { width: 20px; height: 20px; }
    .tbl.scorers tr.rk3 .badge { width: 18px; height: 18px; }
    .tbl.scorers tr.rk1 .stat-val { font-size: 19px; }
    .tbl.scorers tr.rk2 .stat-val { font-size: 18px; }
    .tbl.scorers tr.rk3 .stat-val { font-size: 17px; }
    /* 1位の名前：金属調の金色 */
    .nm-gold { background-image: linear-gradient(160deg, #ecc451 0%, #d39a1d 55%, #b07a10 100%); -webkit-background-clip: text; background-clip: text; color: transparent !important; -webkit-text-fill-color: transparent; }
    /* 2位の名前：金属調の銀色 */
    .nm-silver { background-image: linear-gradient(160deg, #9aa6b3 0%, #6e7a88 55%, #58636f 100%); -webkit-background-clip: text; background-clip: text; color: transparent !important; -webkit-text-fill-color: transparent; }
    /* 得点ランキングの選手名：タップで選手ページへ（見た目は変えない） */
    .pl-link { color: inherit; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* ─── 選手ページ ───
       並びはスポーツナビの選手名鑑と同じ（上部 → プロフィール → 個人成績3列×3段 → 試合ごと）。
       見た目は海外のサッカーサイト風（ユーザー指示 2026-10-22「パクリと言われないよう、レイアウトは変えずに海外風に」） */
    #playerPage { font-family: 'M PLUS 1p', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .pl-back { background: var(--white); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700; color: #0f172a; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
    .pl-hero { position: relative; overflow: hidden; color: #fff; border-radius: 18px; padding: 22px 16px 22px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 160px;
      background: repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 14px, rgba(255,255,255,0) 14px 28px), linear-gradient(135deg, #0b1220 0%, #14223a 50%, #1f3d66 100%); box-shadow: 0 8px 24px rgba(11,18,32,0.25); }
    .pl-hero-wm { position: absolute; right: -6px; bottom: -34px; font-size: 150px; font-weight: 800; line-height: 1; color: rgba(255,255,255,0.07); pointer-events: none; font-variant-numeric: tabular-nums; }
    .pl-hero-main { position: relative; flex: 1; min-width: 0; }   /* 透かしの背番号より手前に。名前は残りの幅いっぱいに使う */
    .pl-hero-img { position: relative; }
    .pl-hero-name { font-size: 27px; font-weight: 800; line-height: 1.2; letter-spacing: .01em; word-break: keep-all; overflow-wrap: anywhere; }
    .pl-hero-num { margin-top: 12px; display: flex; align-items: center; gap: 10px; min-height: 34px; }
    .pl-hero-num b { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .pl-hero-num span { font-size: 12px; font-weight: 800; letter-spacing: .12em; padding: 4px 10px; border-radius: 999px; background: #22c55e; color: #052e16; }
    .pl-hero-img { width: 104px; height: 104px; border-radius: 50%; background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pl-hero-img img { width: 76px; height: 76px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }
    .pl-sec { background: var(--white); border-radius: 18px; margin-top: 14px; padding: 18px 16px 16px; box-shadow: 0 2px 10px rgba(15,23,42,0.06); }
    .pl-ov { display: block; font-size: 11px; font-weight: 800; letter-spacing: .16em; color: #2563eb; margin-bottom: 2px; }
    .pl-sec-h { font-size: 19px; font-weight: 800; color: #0f172a; margin: 0 0 12px; }
    .pl-sub-h { font-size: 14px; font-weight: 800; color: #0f172a; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .pl-sub-h::before { content: ''; width: 14px; height: 3px; border-radius: 2px; background: #2563eb; }
    .pl-sec > .pl-sub-h:first-of-type { margin-top: 4px; }
    .pl-prof { display: flex; flex-direction: column; }
    .pl-prof-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #eef1f5; }
    .pl-prof-row:first-child { border-top: none; padding-top: 2px; }
    .pl-prof-row span { font-size: 13px; color: #64748b; }
    .pl-prof-row b { font-size: 15px; font-weight: 700; color: #0f172a; text-align: right; }
    .pl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pl-log th, .pl-log td { padding-left: 5px; padding-right: 5px; }
    .pl-tile { background: #f4f6fa; border-radius: 12px; padding: 11px 10px 12px; min-width: 0; }
    .pl-tile span { display: block; font-size: 11px; color: #64748b; font-weight: 700; line-height: 1.3; }   /* 狭い画面では項目名を折り返す（切らない） */
    .pl-tile b { display: block; font-size: 24px; font-weight: 800; color: #0f172a; margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .pl-log { width: 100%; border-collapse: collapse; font-size: 14px; }
    .pl-log th { font-size: 11px; color: #64748b; font-weight: 700; text-align: center; padding: 0 2px 8px; border-bottom: 2px solid #0f172a; white-space: nowrap; }
    .pl-log td { text-align: center; padding: 11px 2px; border-bottom: 1px solid #eef1f5; font-variant-numeric: tabular-nums; white-space: nowrap; color: #0f172a; }
    .pl-log td.pl-date { font-weight: 800; text-align: left; padding-left: 2px; }
    .pl-log th:first-child { text-align: left; padding-left: 2px; }
    .pl-log td.pl-min { text-align: left; }
    .pl-log tr.pl-future td { color: #b6c0cc; }
    .pl-log tr.pl-future td.pl-date { font-weight: 700; }
    .pl-s { display: inline-block; background: #16a34a; color: #fff; font-size: 10px; font-weight: 800; min-width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
    .pl-in { display: inline-block; color: #16a34a; background: #dcfce7; font-size: 9px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
    .pl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }   /* 狭い画面では表だけ横にスライド */
    .pl-opp { display: inline-flex; align-items: center; gap: 5px; }
    .pl-opp img { width: 16px; height: 16px; flex-shrink: 0; }
    .pl-opp i { font-style: normal; font-size: 10px; color: #94a3b8; margin-left: 3px; }
    .pl-log td.pl-oppc { text-align: left; white-space: nowrap; }
    .pl-resline { margin-top: 3px; font-size: 12px; font-weight: 700; color: #334155; }
    .pl-log td.pl-cname { text-align: left; white-space: normal; min-width: 96px; font-weight: 700; }
    .pl-res { display: inline-block; font-size: 10px; font-weight: 800; width: 17px; height: 17px; line-height: 17px; border-radius: 4px; color: #fff; margin-right: 4px; vertical-align: 1px; }
    .pl-res-W { background: #16a34a; } .pl-res-L { background: #ef4444; } .pl-res-D { background: #94a3b8; }
    /* 個人成績・試合ごとの表：スポーツナビ再現版(10/22)の作りをそのまま（名前・プロフィールは海外風のまま） */
    .sn-grid, .sn-log { width: calc(100% + 32px); margin: 0 -16px; border-collapse: collapse; }
    .sn-grid { table-layout: fixed; font-size: 15px; }
    .sn-grid th { background: #eaf1fd; color: #1e3a8a; font-weight: 700; font-size: 13px; text-align: center; padding: 11px 4px; border: 1px solid #d3deef; border-left: none; }
    .sn-grid td { text-align: right; padding: 12px 10px; border: 1px solid #d3deef; border-left: none; font-variant-numeric: tabular-nums; color: #0f172a; font-weight: 700; }
    .sn-grid tr > :last-child, .sn-log tr > :last-child { border-right: none; }
    .sn-log { font-size: 14px; }
    .sn-log th { background: #1e3a8a; color: #fff; font-weight: 700; font-size: 12px; text-align: center; padding: 10px 2px; border: 1px solid #1e3a8a; border-right-color: rgba(255,255,255,0.35); border-left: none; }
    .sn-log td { text-align: right; padding: 11px 6px; border-top: 1px solid #d3deef; border-bottom: 1px solid #d3deef; border-right: 1px solid #93a6c4; border-left: none; font-variant-numeric: tabular-nums; white-space: nowrap; color: #0f172a; }
    .sn-log tbody tr:nth-child(even) td { background: #f7f9fd; }
    .sn-log td.sn-hit { background: #e8f7ee !important; color: #15803d; font-weight: 800; }   /* 得点・PK・アシストが1以上 */
    .sn-log td.sn-card { color: #b45309; font-weight: 800; }                                /* 警告・退場あり */
    .sn-log tr.sn-dnp td { color: #94a3b8; }                                                 /* 出場なし */
    .sn-log tr.sn-future td { background: #fbfcfe; }
    .sn-log tr.sn-future td.sn-date { color: #7aa2e3; }
    .sn-log td.sn-date { color: #1d6fd8; font-weight: 700; text-align: center; }
    .sn-log td.sn-min { text-align: left; }
    .sn-s { display: inline-block; background: #3cc37a; color: #fff; font-size: 11px; font-weight: 700; width: 17px; height: 17px; line-height: 17px; text-align: center; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
    .sn-in { display: inline-block; color: #22b04b; font-size: 11px; width: 17px; text-align: center; margin-right: 6px; }
    /* 同じポジションの平均との比較（横棒）：棒＝この選手、縦線＝平均。平均以上は緑、未満は橙 */
    .cmp-note { font-size: 12px; color: #64748b; line-height: 1.5; margin: -4px 0 8px; }
    .cmp-warn { color: #b45309; }
    .cmp-legend { display: flex; gap: 14px; font-size: 11px; color: #64748b; margin-bottom: 4px; }
    .cmp-key { display: inline-block; width: 14px; height: 8px; border-radius: 4px; background: #16a34a; margin-right: 5px; vertical-align: 0; }
    .cmp-key.avg { width: 2px; height: 12px; border-radius: 0; background: #0f172a; vertical-align: -2px; }
    .cmp-row { padding: 9px 0; border-top: 1px solid #eef1f5; }
    .cmp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .cmp-lbl { font-size: 13px; font-weight: 700; color: #334155; }
    .cmp-val { font-size: 16px; font-weight: 800; color: #0f172a; font-variant-numeric: tabular-nums; }
    .cmp-val small { font-size: 11px; font-weight: 700; color: #94a3b8; margin-left: 8px; }
    .cmp-track { position: relative; height: 10px; background: #eef2f7; border-radius: 5px; }
    .cmp-fill { height: 10px; border-radius: 5px; background: #16a34a; }
    .cmp-fill.low { background: #f59e0b; }
    .cmp-avg { position: absolute; top: -4px; width: 2px; height: 18px; background: #0f172a; transform: translateX(-1px); }
    .pl-wait { color: var(--muted); font-size: 13px; padding: 10px 0; }
    .pl-err { color: var(--muted); font-size: 13px; padding: 10px 0; }

    /* ─── Standings ─── */
    .tbl.stnd td { padding: 6px 8px; vertical-align: middle; }
    /* 順位表：順位・クラブ名は左に固定し、勝点から右の数字だけ横スライドする（5/16版の仕様を復元）。
       固定した列には背景色が必要（無いと、下を流れる数字が透けて見える）。left の値は pinStandingsCols() が実測して入れる */
    .stnd-scroll .tbl.stnd { overflow: visible; }
    /* 長いクラブ名：列幅に合わせて横幅だけ詰める（pinStandingsCols が幅と倍率を設定） */
    .st-nm-fit { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: middle; }
    /* 端でスライドを引っ張った時に表全体（固定した左側ごと）がビヨンと動くのを止める */
    .stnd-scroll { overscroll-behavior-x: none; }
    .stnd-scroll .tbl.stnd .zone-bar,
    .stnd-scroll .tbl.stnd .stnd-rank,
    .stnd-scroll .tbl.stnd .stnd-team { position: sticky; z-index: 2; background: var(--white); }
    .stnd-scroll .tbl.stnd .zone-bar { left: 0; }
    .stnd-scroll .tbl.stnd tbody tr:nth-child(even) .stnd-rank,
    .stnd-scroll .tbl.stnd tbody tr:nth-child(even) .stnd-team { background: var(--row-alt); }
    .stnd-scroll .tbl.stnd thead .zone-bar,
    .stnd-scroll .tbl.stnd thead .stnd-rank,
    .stnd-scroll .tbl.stnd thead .stnd-team { background: #e8eaf6; z-index: 3; }
    .zone-bar { width: 4px !important; padding: 0 !important; }
    /* 色帯の列は中身が空だと幅0に潰れて見えなくなっていた（出場権の緑・降格の赤が出ない） */
    .zb-fill { width: 4px; }
    .stnd-rank { width: 28px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
    .stnd-team { font-size: 13px; font-weight: 500; white-space: nowrap; }
    .stnd-team-inner { display: flex; align-items: center; gap: 6px; }
    .scorer-name-inner { display: flex; align-items: center; gap: 7px; }   /* 得点ランキング：クラブのマーク＋選手名 */
    .stnd-badge { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .stnd-num { width: 30px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
    .scorer-sub-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .scorer-sub { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--muted); }
    .scorer-sub.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .stnd-w   { color: #16a34a; font-weight: 700; }
    .stnd-d   { color: #94a3b8; font-weight: 600; }
    .stnd-l   { color: #ef4444; font-weight: 700; }
    .stnd-pts { width: 42px; text-align: center; font-size: 14px; font-weight: 800; color: var(--indigo); font-variant-numeric: tabular-nums; }
    .stnd-gd  { width: 42px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
    /* ─── Bubbles ─── */
    @keyframes riseUp {
      0%   { transform: translateY(0) scale(1); opacity: 0.7; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-105vh) scale(1.15); opacity: 0; }
    }
    /* 画面上端に触れる全画面の固定レイヤーはiOS Safariのバー表示を壊すので、上端から離す（6/12解決済みの内容） */
    #bubbles { position: fixed; left: 0; right: 0; bottom: 0; top: 120px; pointer-events: none; z-index: 0; overflow: hidden; }
    .bubble { position: absolute; bottom: -60px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.45); animation: riseUp linear infinite; }
    #schedulePage, #standingsPage, #scorersPage, #editPage { position: relative; z-index: 1; }
    .stnd-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 0 12px; font-size: 11px; color: var(--muted); }
    .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

    /* ─── Scorers ─── */
    .scorers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .scorers-grid { grid-template-columns: 1fr; } }
    .scorer-subtitle {
      font-size: 12px; font-weight: 700; color: var(--indigo);
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 8px; padding: 0 2px;
    }
    .player-inner { display: inline-flex; align-items: center; gap: 8px; }
    .player-hs { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e2e8f0; }
    .stat-val { width: 42px; text-align: center; font-size: 15px; font-weight: 800; color: var(--indigo); font-variant-numeric: tabular-nums; }

    /* ─── Knockout list (フォールバック) ─── */
    .ko-round { margin-bottom: 20px; }
    .ko-round-head {
      font-size: 13px; font-weight: 800; color: var(--indigo);
      text-transform: uppercase; letter-spacing: .4px;
      padding: 10px 0 6px; border-bottom: 2px solid var(--indigo);
      margin-bottom: 10px;
    }
    .ko-tie {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 8px; overflow: hidden;
    }
    .ko-leg {
      display: flex; align-items: center;
      padding: 9px 14px; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .ko-leg:last-of-type { border-bottom: none; }
    .ko-leg-num {
      font-size: 10px; font-weight: 700; color: var(--muted);
      min-width: 36px; flex-shrink: 0;
    }
    .ko-team { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
    .ko-team.right { text-align: right; }
    .ko-team.winner { font-weight: 800; color: var(--indigo); }
    .ko-score-box {
      display: flex; align-items: center; gap: 4px;
      font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
      color: var(--text); min-width: 52px; justify-content: center; flex-shrink: 0;
    }
    .ko-score-sep { font-weight: 400; color: var(--muted); }
    .ko-agg {
      padding: 5px 14px; font-size: 11px; color: var(--muted);
      background: var(--row-alt); border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .ko-agg-winner { font-weight: 700; color: var(--indigo); }
    .ko-note { font-size: 11px; color: var(--muted); font-style: italic; }

    /* ─── Tournament Bracket (SVG connector) ─── */
    .bracket-outer { overflow-x: auto; padding: 8px 0 20px; -webkit-overflow-scrolling: touch; }
    .bracket-wrap { position: relative; display: flex; align-items: flex-start; }
    .bc-half { display: flex; flex: 1; align-items: flex-start; }
    .bc-col {
      display: flex; flex-direction: column;
      width: 116px; flex-shrink: 0; padding: 0 5px;
    }
    .bc-spacer { flex-shrink: 0; }
    .bc-match {
      display: flex; flex-direction: column;
      border-radius: 5px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); flex-shrink: 0;
    }
    .bc-team {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 7px; background: var(--white); border: 1px solid var(--border);
      font-size: 11px; line-height: 1.2; height: 28px;
      white-space: nowrap; overflow: hidden;
    }
    .bc-team + .bc-team { border-top: none; }
    .bc-team.bc-w  { background: #eef2ff; border-color: #818cf8; font-weight: 700; color: var(--indigo); }
    .bc-team.bc-ch { background: #fef9c3; border-color: #eab308; font-weight: 800; color: #92400e; }
    .bc-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .bc-sc { font-size: 10px; color: var(--muted); flex-shrink: 0; padding-left: 4px; font-variant-numeric: tabular-nums; }
    .bc-lbl {
      text-align: center; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px; color: var(--muted);
      padding: 4px 0 5px; height: 22px; flex-shrink: 0;
    }
    .bc-final-col {
      display: flex; flex-direction: column; align-items: center;
      width: 116px; flex-shrink: 0; padding: 0 5px;
    }
    .bc-trophy { font-size: 18px; text-align: center; padding: 2px 0; }
    .bc-champ-name { font-size: 10px; font-weight: 700; color: #92400e; text-align: center; padding: 1px 0; }
    .bc-svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }

    /* ─── PIN dialog ─── */
    #pinDialog {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    #pinDialog.open { display: flex; }
    #pinBox {
      background: var(--white); border-radius: 12px; padding: 28px 24px;
      min-width: 240px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    #pinBox h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    #pinInput {
      display: block; width: 100%; text-align: center; letter-spacing: 6px;
      font-size: 22px; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; margin-bottom: 6px; font-family: monospace;
    }
    #pinInput:focus { border-color: var(--indigo); outline: none; }
    #pinError { font-size: 12px; color: #ef4444; min-height: 18px; margin-bottom: 10px; }
    .pin-btns { display: flex; gap: 8px; }
    .pin-ok { flex: 1; padding: 9px; background: var(--indigo); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .pin-cancel { padding: 9px 14px; background: none; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--muted); }

    /* ─── Admin mode ─── */
    #adminBadge {
      display: none; font-size: 10px; font-weight: 700; letter-spacing: .4px;
      background: #f59e0b; color: #fff; padding: 2px 8px; border-radius: 10px;
    }
    body.admin-mode #adminBadge { display: inline-block; }
    .admin-name {
      cursor: pointer; border-bottom: 1px dashed #f59e0b;
      transition: color .1s;
    }
    .admin-name:hover { color: #d97706; }
    #adminPopup {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    #adminPopup.open { display: flex; }
    #adminPopupBox {
      background: var(--white); border-radius: 10px; padding: 20px 24px;
      min-width: 280px; box-shadow: 0 8px 32px rgba(0,0,0,.18);
    }
    #adminPopupLabel { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    #adminPopupEn { font-size: 12px; color: var(--muted); margin-bottom: 10px; word-break: break-all; }

    #adminPopupInput {
      flex: 1; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px;
    }
    #adminPopupInput:focus { border-color: var(--indigo); outline: none; }
    #adminWikiBtn {
      padding: 0 10px; background: none; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap;
      color: var(--muted); transition: border-color .15s, color .15s;
    }
    #adminWikiBtn:hover { border-color: var(--indigo); color: var(--indigo); }
    #adminWikiStatus { font-size: 11px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
    .admin-popup-btns { display: flex; gap: 8px; justify-content: flex-end; }
    /* 名前編集ページのWikiボタン */
    .wiki-btn {
      padding: 2px 7px; font-size: 11px; background: none;
      border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; color: var(--muted); flex-shrink: 0;
    }
    .wiki-btn:hover { border-color: var(--indigo); color: var(--indigo); }
    .wiki-btn.loading { opacity: .5; pointer-events: none; }
    .admin-popup-save {
      padding: 7px 20px; background: var(--indigo); color: #fff;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .admin-popup-cancel {
      padding: 7px 16px; background: none; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px; font-size: 13px; cursor: pointer;
    }

    /* ─── Name Edit Page ─── */
    .edit-section { margin-bottom: 36px; }
    .edit-search {
      display: block; width: 100%; padding: 8px 12px; margin-bottom: 8px;
      border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
      background: var(--white); color: var(--text);
    }
    .edit-search:focus { border-color: var(--indigo); outline: none; }
    .edit-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .edit-tbl th {
      text-align: left; padding: 7px 10px;
      background: var(--row-alt); border-bottom: 2px solid var(--border);
      font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .4px;
      position: sticky; top: 0;   /* ヘッダーが固定でなくなったので画面上端に合わせる（管理者の名前編集ページ） */
    }
    .edit-tbl td { padding: 4px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .edit-tbl td:first-child { color: var(--muted); font-size: 12px; width: 50%; }
    .edit-inp {
      width: 100%; padding: 4px 8px; border: 1px solid var(--border);
      border-radius: 4px; font-size: 13px; font-family: inherit;
      background: var(--white); color: var(--text);
    }
    .edit-inp:focus { border-color: var(--indigo); outline: none; background: var(--row-hl); }
    .edit-inp.changed { border-color: #f59e0b; background: #fefce8; }
    .edit-save-row { text-align: center; padding: 16px 0 32px; }
    .edit-save-btn {
      padding: 11px 44px; background: var(--indigo); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; letter-spacing: .3px;
    }
    .edit-save-btn:hover { background: var(--ind2); }
    .edit-saved { font-size: 13px; color: #10b981; margin-top: 8px; min-height: 20px; }

    /* ─── State ─── */
    .state { text-align: center; padding: 60px 16px; color: var(--muted); }
    .state .ico { font-size: 32px; display: block; margin-bottom: 10px; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .hide-sm { display: none; }
      /* ヘッダーは固定しない（以前は画面上部に固定し、スクロールでゆっくり引っ込む演出だったが廃止）。
         固定をやめたので、ヘッダーの高さぶんの余白(padding-top)も不要 */
      /* 試合日程 */
      #scheduleWrap { padding-left: 2px; padding-right: 2px; }
      .tbl.sched td { padding: 4px 0; }
      .tbl tr.drow td { padding: 6px 8px; }
      .th-time  { width: 38px; }
      .th-score { width: 44px; }
      .th-comp  { width: 40px; }
      .td-score { width: 44px; padding: 4px 0; vertical-align: middle; text-align: center; }
      .score-inner { display: flex; flex-direction: column; align-items: center; gap: 1px; }
      .score-inner .t-pre  { position: static; display: inline-block; font-size: 12px; font-weight: 700; color: #fff; font-family: 'BIZ UDPMincho', serif; line-height: 1.3; background: rgba(10,40,80,0.55); border-radius: 5px; padding: 1px 5px; text-shadow: none; }
      .score-inner .t-fin  { position: static; font-size: 13px; font-weight: 500; line-height: 1.15; }
      .score-inner .t-live { position: static; font-size: 13px; font-weight: 700; line-height: 1.15; }
      .td-comp  { width: 40px; max-width: 40px; font-size: 10px; padding: 4px 0; color: var(--text); font-weight: 600; border-left: 2px solid #94a3b8 !important; }
      .td-home, .td-away { font-size: 14px; padding: 4px 0; overflow: hidden; }
      .team-inner { display: flex; width: 100%; overflow: hidden; }
      .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .t-pre { font-size: 14px; }
      .score-num { font-size: 13px; line-height: 1.15; }
      .score-vs  { color: #94a3b8; font-weight: 600; font-size: 11px; line-height: 1.15; }
      .score-comp { position: static; font-size: 9px; color: var(--muted); line-height: 1.1; }
      .badge { width: 16px; height: 16px; flex-shrink: 0; }
      #lastUpdated { display: none; }
      /* 順位表: overflow は buildStandingsHtml の div wrapper で対応済み */
      .tbl.stnd td { font-size: 12px; padding: 5px 4px; }
      /* 順位表は画面の左右端まで広げる（周りの水色の背景が見えないように） */
      .stnd-scroll { margin-left: -16px; margin-right: -16px; }
      .stnd-scroll .tbl.stnd { border-radius: 0; margin-bottom: 20px; }
      .stnd-rank { width: 20px; }
      .stnd-num  { width: 24px; }
      .stnd-pts  { width: 30px; }
      .stnd-gd   { width: 30px; }
    }
    /* 幅の狭い端末（iPhone SE等 320〜360px）：上のメニュー3項目が右端で切れないよう余白を詰める */
    @media (max-width: 360px) {
      #topbar  { padding: 0 12px; }
      #pageNav { padding: 0 6px; }
      .pnav    { padding: 0 9px; font-size: 12px; }
    }
  </style>
</head>

if (LANG !== 'ja') document.documentElement.classList.add('lang-en');
// iOS 26以降のSafariの目印（最上部のもや対策 #iosTopTint 用）。SafariのUAは "Version/26.0" のように版数が入る
(function () {
  const ua = navigator.userAgent;
  const m = ua.match(/Version\/(\d+)/);
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (isIOS && m && parseInt(m[1], 10) >= 26) document.documentElement.classList.add('ios26');

const WC_START = new Date('2026-06-11T00:00:00Z');
const WC_END   = new Date('2026-07-20T00:00:00Z');

const T = {

};

/* ════════════════════════════════════════
   データ定義
════════════════════════════════════════ */
const SCHEDULE_LEAGUES = [
  ...(isWorldCup ? [{ code: 'fifa.world', label: LANG==='ja'?'ワールドカップ':'World Cup', short: 'WC', country: 'world', color: '#dc2626' }] : []),
  { code: 'eng.1',               label: LANG==='ja'?'プレミアリーグ':'Premier League',        short: 'Premier',   country: 'england', color: '#6d28d9' },

  { code: 'uefa.europa',         label: LANG==='ja'?'ヨーロッパリーグ':'Europa League',       short: 'EL',        country: 'europe',  color: '#ea580c' },

];

const COUNTRY_FILTERS = [
  ...(isWorldCup ? [{ id: 'world', label: LANG==='ja'?'🌍 W杯':'🌍 World Cup' }] : []),
  { id: 'all',     label: LANG==='ja'?'すべて':'All'           },
  { id: 'england', label: LANG==='ja'?'イングランド':'England' },
  { id: 'spain',   label: LANG==='ja'?'スペイン':'Spain'       },
  { id: 'germany', label: LANG==='ja'?'ドイツ':'Germany'       },

/* ════════════════════════════════════════
   ライブ反映用・通信ユーティリティ
   - fetchJson: リトライ＋10秒タイムアウト（モバイル回線はfetchがエラーにならず永遠にハングする
     ことがあり、放置すると自動更新チェーンが無言で死ぬ）＋キャッシュ回避
   - mapPool  : 同時実行数を絞る（一斉送信だとESPNのレート制限で歯抜けになる）
════════════════════════════════════════ */
const FETCH_CONCURRENCY = 6;
const FETCH_RETRIES     = 2;
const FETCH_TIMEOUT     = 10_000;
async function fetchJson(url, { retries = FETCH_RETRIES, timeout = FETCH_TIMEOUT, fresh = true } = {}) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), timeout);
    try {
      // fresh=true: 毎回ユニークな ?_= でESPN側CDNの古いスナップショットを掴まない（ライブ/結果用）。
      // fresh=false: 先の予定など鮮度不要のものはキャッシュを使って速く取る
      const bust = fresh ? (url.includes('?') ? '&' : '?') + '_=' + Date.now() + '-' + attempt : '';
      const res = await fetch(url + bust, { cache: fresh ? 'no-store' : 'default', signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      lastErr = e;
      if (attempt < retries) await new Promise(r => setTimeout(r, 350 * (attempt + 1) + Math.random() * 200));
    } finally {
      clearTimeout(tid);
    }
  }
  throw lastErr;
}
async function mapPool(items, limit, fn) {
  const results = new Array(items.length);
  let i = 0;
  async function worker() {
    while (i < items.length) { const idx = i++; results[idx] = await fn(items[idx], idx); }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

function esc(s)  { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function currentSeason() {
  const d = new Date();
  return (d.getMonth() + 1) >= 8 ? d.getFullYear() : d.getFullYear() - 1;
}

// ESPNの色指定を正す（「##B5E7CE」のように # が重なった誤記があり、色が付かなかった）
function normColor(c) {
  const hex = String(c || '').replace(/^#+/, '');
  return /^[0-9a-f]{3,8}$/i.test(hex) ? '#' + hex : null;
}

function extractId(ref, key) {
  return ref?.match(new RegExp(`${key}\\/(\\d+)`))?.[1] ?? null;
}

/* 英語名 → カタカナ 自動変換（マップ未登録時のフォールバック） */
function nameToKatakana(name) {
  if (!name || /[぀-ヿ一-鿿]/.test(name)) return name;
  let s = name.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/ñ/g,'n').replace(/[çć]/g,'s').replace(/[øö]/g,'o')
    .replace(/ß/g,'ss').replace(/š/g,'sh').replace(/č/g,'ch')
    .replace(/ž/g,'j').replace(/ğ/g,'g').replace(/ı/g,'i')
    .replace(/ř/g,'r').replace(/ď/g,'d').replace(/ť/g,'t')
    .replace(/ő/g,'o').replace(/ű/g,'u').replace(/ã/g,'a');
  return s.split(/[\s\-–—·]+/).filter(Boolean).map(word => {
    const w = word.toLowerCase().replace(/[^a-z]/g,'');
    if (!w) return word;
    const isV = c => 'aeiou'.includes(c);
    const CV = {
      'ka':'カ','ki':'キ','ku':'ク','ke':'ケ','ko':'コ','kya':'キャ','kyu':'キュ','kyo':'キョ',
      'sa':'サ','si':'シ','su':'ス','se':'セ','so':'ソ',
      'sha':'シャ','shi':'シ','shu':'シュ','she':'シェ','sho':'ショ',
      'ta':'タ','ti':'ティ','tu':'トゥ','te':'テ','to':'ト',
      'chi':'チ','cha':'チャ','chu':'チュ','che':'チェ','cho':'チョ','tsu':'ツ',
      'na':'ナ','ni':'ニ','nu':'ヌ','ne':'ネ','no':'ノ',
      'ha':'ハ','hi':'ヒ','hu':'フ','he':'ヘ','ho':'ホ',
      'fa':'ファ','fi':'フィ','fu':'フ','fe':'フェ','fo':'フォ',
      'ma':'マ','mi':'ミ','mu':'ム','me':'メ','mo':'モ',
      'ya':'ヤ','yi':'イ','yu':'ユ','ye':'イェ','yo':'ヨ',
      'ra':'ラ','ri':'リ','ru':'ル','re':'レ','ro':'ロ',
      'la':'ラ','li':'リ','lu':'ル','le':'ル','lo':'ロ',
      'wa':'ワ','wi':'ウィ','wu':'ウ','we':'ウェ','wo':'ヲ',
      'ga':'ガ','gi':'ギ','gu':'グ','ge':'ゲ','go':'ゴ','gya':'ギャ','gyu':'ギュ','gyo':'ギョ',
      'za':'ザ','zi':'ジ','zu':'ズ','ze':'ゼ','zo':'ゾ',
      'ja':'ジャ','ji':'ジ','ju':'ジュ','je':'ジェ','jo':'ジョ',
      'da':'ダ','di':'ディ','du':'ドゥ','de':'デ','do':'ド',
      'ba':'バ','bi':'ビ','bu':'ブ','be':'ベ','bo':'ボ',
      'pa':'パ','pi':'ピ','pu':'プ','pe':'ペ','po':'ポ',
      'va':'ヴァ','vi':'ヴィ','vu':'ヴ','ve':'ヴェ','vo':'ヴォ',
      'ca':'カ','ci':'シ','cu':'ク','ce':'セ','co':'コ',
      'xa':'シャ','xi':'シ','xu':'シュ','xe':'シェ','xo':'ショ',
      'a':'ア','i':'イ','u':'ウ','e':'エ','o':'オ',
    };
    const SC = {'b':'ブ','c':'ク','d':'ド','f':'フ','g':'グ','h':'','j':'ジ','k':'ク',
                'l':'ル','m':'ム','n':'ン','p':'プ','q':'ク','r':'ル','s':'ス','t':'ト',
                'v':'ヴ','w':'ウ','x':'クス','y':'イ','z':'ズ'};
    let r = '', i = 0;
    while (i < w.length) {
      const c=w[i], n=w[i+1]||'', n2=w[i+2]||'';
      if (c+n+n2==='tch'){r+='ッチ';i+=3;continue;}
      if (!isV(c)&&c===n&&c!=='n'){r+='ッ';i++;continue;}
      if (c+n==='ph'){r+=isV(n2)?CV['f'+n2]||'フ':'フ';i+=isV(n2)?3:2;continue;}
      if (c+n==='ch'){r+=CV['ch'+n2]||(isV(n2)?CV['ch'+n2]:'チ')||'チ';i+=isV(n2)?3:2;continue;}
      if (c+n==='sh'){r+=CV['sh'+n2]||'シ';i+=isV(n2)?3:2;continue;}
      if (c+n==='th'){r+='ス';i+=2;continue;}
      if (c+n==='gh'&&!isV(n2)){i+=2;continue;}
      if (c+n==='ck'){r+='ク';i+=2;continue;}
      if (c+n==='ng'){r+='ング';i+=2;continue;}
      if (c+n==='qu'){r+=isV(n2)?CV['k'+n2]||'ク':'ク';i+=isV(n2)?3:2;continue;}
      if (c+n==='wh'){r+=isV(n2)?CV['w'+n2]||'ウ':'ウ';i+=isV(n2)?3:2;continue;}
      if ((c+n==='er'||c+n==='ar'||c+n==='or')&&i===w.length-2){r+='ー';i+=2;continue;}
      if (c==='e'&&i===w.length-1&&r.length>0&&!isV(w[i-1]||'')){i++;continue;}
      if (c+n+n2==='eau'){r+='オー';i+=3;continue;}
      if (c+n==='aa'||c+n==='oo'||c+n==='uu'){r+=CV[c]+'ー';i+=2;continue;}
      if (c+n==='ou'){r+='ウ';i+=2;continue;}
      if (c+n==='au'){r+='オ';i+=2;continue;}
      if (c+n==='oi'){r+='ワ';i+=2;continue;}
      if (c+n==='ie'&&!isV(n2)){r+='イ';i+=2;continue;}
      if (c+n==='ie'&&isV(n2)){r+='イエ';i+=2;continue;}
      if (c+n==='ei'){r+='エイ';i+=2;continue;}
      if (c+n==='ay'){r+='エイ';i+=2;continue;}
      if (c+n==='ey'){r+='エイ';i+=2;continue;}
      if (c+n==='gn'&&isV(n2)){r+='ニ';i+=2;continue;}
      if (!isV(c)&&isV(n)){const k=CV[c+n];if(k){r+=k;i+=2;continue;}}
      if (isV(c)){r+=CV[c]||c;i++;continue;}
      r+=SC[c]||c;i++;
    }
    return r||word;
  }).join('・');
}

function teamNameJa(name) {
  if (!name) return name;
  if (LANG !== 'ja') return name;
  return nameOverrides.teams[name]
      || TEAM_NAMES_JA[name]
      || TEAM_NAMES_JA[name.replace(/\s+FC$/i,'').trim()]
      || TEAM_NAMES_JA[name.replace(/^FC\s+/i,'').trim()]
      || nameToKatakana(name);
}

// Wikipedia由来の名前に付く曖昧さ回避注記「(1974年生のサッカー選手)」等の末尾括弧を除去
function cleanJaName(s) {
  if (!s) return s;
  return String(s).replace(/\s*[（(][^（()）]*[)）]\s*$/, '').trim();
}
function playerNameJa(name) {
  if (!name) return name;
  if (LANG !== 'ja') return name;
  // 手動登録 or Wikipediaで確定した日本語名があればそれを使う。
  // 無ければ（カタカナ自動変換はせず）英語表記のまま表示する（2026-07のユーザー指示）。
  return cleanJaName(nameOverrides.players[name] || PLAYER_NAMES_JA[name] || name);
}

function getLogo(team) {
  if (!team) return null;
  if (typeof team.logo === 'string' && team.logo) return team.logo;
  if (team.logo?.href) return team.logo.href;
  if (Array.isArray(team.logos) && team.logos[0]?.href) return team.logos[0].href;
  return null;
}

/* ════════════════════════════════════════
   日またぎ時刻
════════════════════════════════════════ */
function getMatchTiming(utcStr) {
  const d = new Date(utcStr);
  const tz = LANG === 'ja' ? 'Asia/Tokyo' : Intl.DateTimeFormat().resolvedOptions().timeZone;
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(d);
  const get = t => parts.find(p => p.type === t)?.value ?? '00';
  let h = parseInt(get('hour'));
  const m = get('minute');
  if (h === 24) h = 0;
  const localDate = `${get('year')}-${get('month')}-${get('day')}`;
  return { logicalDate: localDate, displayTime: `${String(h).padStart(2,'0')}:${m}`, isLate: false };
}

function dayLabel(dateStr) {
  const tz = LANG === 'ja' ? 'Asia/Tokyo' : Intl.DateTimeFormat().resolvedOptions().timeZone;
  return new Date(dateStr + 'T12:00:00')
    .toLocaleDateString(LANG==='ja'?'ja-JP':'en-US', { timeZone: tz, month: LANG==='ja'?'numeric':'short', day: 'numeric', weekday: 'short' });
}

/* ════════════════════════════════════════
   ① 試合日程 — 取得・描画
════════════════════════════════════════ */
function parseEvent(ev, lg) {
  const comp = ev.competitions?.[0];
  if (!comp) return null;
  const home = comp.competitors?.find(c => c.homeAway === 'home');
  const away = comp.competitors?.find(c => c.homeAway === 'away');
  if (!home || !away) return null;
  // 国際親善試合など(nationFilter)：日本・欧州・南米の国がどちらも出ない試合は一覧に出さない
  if (lg.nationFilter) {
    const hEn = home.team?.displayName || home.team?.name, aEn = away.team?.displayName || away.team?.name;
    if (!isMajorNation(hEn) && !isMajorNation(aEn)) return null;
  }
  const stType = comp.status?.type ?? ev.status?.type ?? {};
  let state  = stType.state ?? 'pre';
  // 完了フラグが最も信頼できる「終了」シグナル。stateが古くても終了済みならpostに。
  // ※端末の時計を使った補正（旧minsFromStart）は、閲覧者の時計ズレでライブが未開始/終了に化ける
  //   原因だったため廃止。ESPNの状態をそのまま信頼する（古い応答は下のマージで弾く）。
  if (stType.completed === true) state = 'post';
  const timing = getMatchTiming(ev.date);
  return {
    id: ev.id, utcDate: ev.date,
    logicalDate: timing.logicalDate, displayTime: timing.displayTime, isLate: timing.isLate,
    homeTeam: teamNameJa(home.team.displayName || home.team.shortDisplayName || home.team.name),
    awayTeam: teamNameJa(away.team.displayName || away.team.shortDisplayName || away.team.name),
    homeLogo: getLogo(home.team), awayLogo: getLogo(away.team),
    homeScore: (state !== 'pre') ? home.score : null,
    awayScore: (state !== 'pre') ? away.score : null,
    state, clock: comp.status?.displayClock || '',
    period: comp.status?.period ?? null, fetchedAt: Date.now(),   // ライブの経過時間を取得後も進めるため
    lgCode: lg.code, homeId: home.id ?? null, awayId: away.id ?? null,   // ライブ照合(verifyStaleLive)用
    // 英語表示のスマホ幅で長い名前を収めるためのESPN公式短縮名・略号（日本語表示では未使用）
    homeShort: home.team?.shortDisplayName || null, awayShort: away.team?.shortDisplayName || null,
    homeAbbr: home.team?.abbreviation || null, awayAbbr: away.team?.abbreviation || null,
    label: lg.label, shortLabel: lg.short || lg.label, country: lg.country, leagueColor: lg.color || '#64748b',
  };
}

async function fetchSchedule() {
  const dayStr = off => {
    const d = new Date(); d.setUTCDate(d.getUTCDate() + off);
    return d.toISOString().slice(0,10).replace(/-/g,'');
  };
  // ⚠️ 2026-09時点でESPNは範囲指定(dates=from-to)を HTTP 400 で拒否する。必ず単日クエリで取る。
  // 【速度対策】ここでは「昨日・今日・明日」だけを取ってすぐ返す（＝すぐ表示できる）。
  //  先の日程(+2〜+6日)は fetchFarDays() が裏で取り、終わったら表示に足す。
  // ライブ時間帯だけ「日付なしクエリ」も追加で取る（ESPN側キャッシュの鮮度がクエリの形ごとに違うため、
  // 同じ試合は「最も進んだ状態」を採用する）。
  const liveWindow = allMatches.length > 0 && refreshIntervalMs() === REFRESH_LIVE;
  const jobs = SCHEDULE_LEAGUES.flatMap(lg => [
    ...[-1, 0, 1].map(o => ({ lg, url: schedUrl(lg, `dates=${dayStr(o)}&`) })),
    ...(liveWindow ? [{ lg, url: schedUrl(lg, '') }] : []),
  ]);
  const results = await mapPool(jobs, NEAR_CONCURRENCY, async ({ lg, url }) => {
    try {
      const d = await fetchJson(url);
      return { code: lg.code, evs: (d.events || []).map(ev => parseEvent(ev, lg)).filter(Boolean) };
    } catch {
      return { code: lg.code, evs: null };   // このURLは失敗（他のクエリ/前回データで補う）
    }
  });

  // リーグごとに集約。1本も成功しなかったリーグは前回データを残す（試合を消さない）
  const perLeague = {};
  for (const { code, evs } of results) {
    if (evs === null) continue;
    (perLeague[code] = perLeague[code] || []).push(...evs);
  }
  for (const code of Object.keys(perLeague)) lastSchedByLeague[code] = perLeague[code];
  return assembleMatches();
}

const NEAR_CONCURRENCY = 12;
function schedUrl(lg, q) { return `${ESPN_SCHED}/${lg.code}/scoreboard?${q}limit=100&lang=ja&region=jp`; }

// 先の日程(UTCで+2〜+8日)と、おととい(-2日)。変わりにくいので10分に1回だけ、裏で取得する。取得したら true
// ※表示範囲は「見る人の時刻で 昨日0時〜7日後24時」。時差があるので、UTCの日付で切ると両端の日が
//   途中で切れる（日本時間だと最終日の夜の試合や、昨日の早朝の試合が出ない）。
//   そのためUTCでは前後1日ずつ広く(-2〜+8)取り、assembleMatches() で現地の日付で切り直す。
async function fetchFarDays() {
  if (Date.now() - farFetchedAt < 10 * 60 * 1000) return false;
  const dayStr = off => {
    const d = new Date(); d.setUTCDate(d.getUTCDate() + off);
    return d.toISOString().slice(0,10).replace(/-/g,'');
  };
  const jobs = SCHEDULE_LEAGUES.flatMap(lg => [-2, 2, 3, 4, 5, 6, 7, 8].map(o => ({ lg, url: schedUrl(lg, `dates=${dayStr(o)}&`) })));
  const results = await mapPool(jobs, FETCH_CONCURRENCY, async ({ lg, url }) => {
    try {
      const d = await fetchJson(url, { fresh: false });   // 未来の予定はキャッシュ利用でよい（速い）
      return { code: lg.code, evs: (d.events || []).map(ev => parseEvent(ev, lg)).filter(Boolean) };
    } catch { return { code: lg.code, evs: null }; }
  });
  const farNew = {};
  let ok = false;
  for (const { code, evs } of results) {
    if (evs === null) continue;
    ok = true;
    (farNew[code] = farNew[code] || []).push(...evs);
  }
  if (!ok) return false;
  for (const c of Object.keys(farNew)) farByLeague[c] = farNew[c];
  farFetchedAt = Date.now();
  return true;
}

/* ── 日程の端末保存（開いた瞬間に前回の日程を出し、裏で最新に差し替えるため） ── */
const SCHED_CACHE_KEY = 'schedCacheV4';   // V2〜V3は深夜の試合を前日扱いにしていた版(10/19、10/20に元へ戻した)。それらの保存は使わない
const SCHED_CACHE_MAX_AGE = 12 * 60 * 60 * 1000;   // 12時間より古い保存は使わない
function schedWindowDays() {
  const tz = LANG === 'ja' ? 'Asia/Tokyo' : Intl.DateTimeFormat().resolvedOptions().timeZone;
  const localDay = off => new Date(Date.now() + off * 86400000).toLocaleDateString('sv-SE', { timeZone: tz });
  return { firstDay: localDay(-1), lastDay: localDay(7) };
}
function saveSchedCache() {
  try {
    localStorage.setItem(SCHED_CACHE_KEY, JSON.stringify({
      v: 1, savedAt: Date.now(), lang: LANG, allMatches, lastSchedByLeague, farByLeague, farFetchedAt,
    }));
  } catch {}
}
// 保存があれば復元して true（表示範囲外の日は落とす）。言語が違う・古すぎる保存は使わない
function restoreSchedCache() {
  try {
    const c = JSON.parse(localStorage.getItem(SCHED_CACHE_KEY) || 'null');
    if (!c || c.v !== 1 || c.lang !== LANG || !(Date.now() - c.savedAt < SCHED_CACHE_MAX_AGE)) return false;
    const { firstDay, lastDay } = schedWindowDays();
    allMatches = (c.allMatches || []).filter(m => m.logicalDate >= firstDay && m.logicalDate <= lastDay);
    lastSchedByLeague = c.lastSchedByLeague || {};
    farByLeague = c.farByLeague || {};
    farFetchedAt = c.farFetchedAt || 0;
    return allMatches.length > 0;
  } catch { return false; }
}

// 近い日(lastSchedByLeague)＋先の日程(farByLeague)から表示用の試合一覧を組み立てる
function assembleMatches() {
  const all = [];
  for (const lg of SCHEDULE_LEAGUES) {
    all.push(...(lastSchedByLeague[lg.code] || []), ...(farByLeague[lg.code] || []));
  }

  // 同一試合IDはバッチ内で「最も進んだ状態」に統合し、さらに過去に見た状態より後退した応答は捨てる
  // 表示範囲は「見る人の時刻での日付」で 昨日〜6日後 を丸ごと。UTCで切ると両端の日が途中で切れる
  // （例：日本時間の6日後は朝8:59までしか入らず、夜の日本代表戦が出ない）。
  // logicalDate は getMatchTiming() が表示用タイムゾーンで出した日付(YYYY-MM-DD)なので、文字列比較で足りる。
  const tz = LANG === 'ja' ? 'Asia/Tokyo' : Intl.DateTimeFormat().resolvedOptions().timeZone;
  const localDay = off => new Date(Date.now() + off * 86400000).toLocaleDateString('sv-SE', { timeZone: tz });
  const firstDay = localDay(-1), lastDay = localDay(7);   // 昨日〜7日後（来週の同じ曜日まで丸ごと）
  const inWindow = e => e.logicalDate >= firstDay && e.logicalDate <= lastDay;

  const byId = {};
  for (const e of all) {
    if (!inWindow(e)) continue;
    byId[e.id] = byId[e.id] ? (moreAdvanced(e, byId[e.id]) ? e : byId[e.id]) : e;
  }
  return Object.values(byId).map(applyMonotonic);
}

// 試合の「進み具合」比較: 状態(pre<in<post) → 経過分(clock)。古い応答による後戻りを防ぐ
const STATE_RANK = { pre: 0, in: 1, post: 2 };
function clockMins(e) { const m = String(e.clock || '').match(/\d+/); return m ? parseInt(m[0], 10) : 0; }
function advKey(e) { return [STATE_RANK[e.state] ?? 0, clockMins(e)]; }
function moreAdvanced(a, b) {
  const ka = advKey(a), kb = advKey(b);
  for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return ka[i] > kb[i];
  return true;
}
function applyMonotonic(e) {
  const prev = matchBest[e.id];
  if (prev && !moreAdvanced(e, prev)) return prev;
  // ライブ中：新しい応答の分数が、前回の値から進めた分数より遅れている（ESPN側の遅れ）なら、
  // スコア等は新しい応答を使いつつ、分数の表示だけ前回から引き継ぐ（表示の分数が巻き戻らないように）
  if (prev && e.state === 'in' && prev.state === 'in' && e.period === prev.period) {
    const a = liveMinute(e), b = liveMinute(prev);
    if (a != null && b != null && a < b) { e.clock = prev.clock; e.fetchedAt = prev.fetchedAt; }
  }
  matchBest[e.id] = e;
  return e;
}

const FINISHED_KEEP_MS = 12 * 60 * 60 * 1000;
function renderSchedule() {
  const wrap = document.getElementById('scheduleWrap');
  const tz = LANG === 'ja' ? 'Asia/Tokyo' : Intl.DateTimeFormat().resolvedOptions().timeZone;
  const todayLocal = new Date().toLocaleDateString('sv-SE', { timeZone: tz });
  const base = activeCountry === 'all' ? allMatches : allMatches.filter(m => m.country === activeCountry);
  // 終了試合は開始から12時間で消す（以前は「昨日の日付以降」を残していたが、日本時間だと前夜の深夜分と
  // その日の夜の分が両方残って多すぎた）
  const nowMs = Date.now();
  const list = base.filter(m => m.state !== 'post' || nowMs - new Date(m.utcDate).getTime() < FINISHED_KEEP_MS);
  if (!list.length) {
    // 試合が無くても絞り込みボタンは必ず残す（消すと「代表戦」等を選んだ後に戻れなくなる）
    const lbl = COUNTRY_FILTERS.find(f => f.id === activeCountry)?.label ?? 'すべて';
    wrap.innerHTML = `
      <div class="sec-head"><button id="countryTriggerBtn" class="sec-title">${esc(lbl)} ▼</button></div>
      <div class="state"><span class="ico">📋</span>${T.noMatches}</div>`;
    return;
  }

  const sorted  = list.slice().sort((a,b) => new Date(a.utcDate) - new Date(b.utcDate));
  const dates   = [...new Set(sorted.map(m => m.logicalDate))];
  const fmt     = s => new Date(s+'T00:00:00+09:00').toLocaleDateString(LANG==='ja'?'ja-JP':'en-US',{month:LANG==='ja'?'numeric':'short',day:'numeric'});
  const range   = `${fmt(dates[0])} 〜 ${fmt(dates[dates.length-1])}`;
  let lastDate  = null;
  const rows    = [];
  for (const m of sorted) {
    if (m.logicalDate !== lastDate) { rows.push(`<tr class="drow"><td colspan="3">${dayLabel(m.logicalDate)}</td></tr>`); lastDate = m.logicalDate; }
    rows.push(scheduleRow(m));
  }
  const label = COUNTRY_FILTERS.find(f => f.id === activeCountry)?.label ?? 'すべて';
  wrap.innerHTML = `
    <div class="sec-head">
      <button id="countryTriggerBtn" class="sec-title">${esc(label)} ▼</button>
      <span class="sec-cnt">${list.length} ${T.matchUnit}</span>
      <span class="sec-range">${range}</span>
    </div>
    <div class="sched-scroll">
    <table class="tbl sched">
      <thead><tr>
        <th class="r">${T.home}</th><th class="c th-score"><span class="th-sc">Score</span></th>
        <th class="l">${T.away}</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    </div>`;
  fitSchedNames();   // 列に入らないクラブ名を実測して詰める（全言語）
  refitSoon();       // 文字の読み込みが遅れて幅が変わった場合に備えて少し後にも測り直す
}

const HALF_KANA_MAP = {
  'ア':'ｱ','イ':'ｲ','ウ':'ｳ','エ':'ｴ','オ':'ｵ',
  'カ':'ｶ','キ':'ｷ','ク':'ｸ','ケ':'ｹ','コ':'ｺ',
  'サ':'ｻ','シ':'ｼ','ス':'ｽ','セ':'ｾ','ソ':'ｿ',
  'タ':'ﾀ','チ':'ﾁ','ツ':'ﾂ','テ':'ﾃ','ト':'ﾄ',
  'ナ':'ﾅ','ニ':'ﾆ','ヌ':'ﾇ','ネ':'ﾈ','ノ':'ﾉ',
  'ハ':'ﾊ','ヒ':'ﾋ','フ':'ﾌ','ヘ':'ﾍ','ホ':'ﾎ',
  'マ':'ﾏ','ミ':'ﾐ','ム':'ﾑ','メ':'ﾒ','モ':'ﾓ',
  'ヤ':'ﾔ','ユ':'ﾕ','ヨ':'ﾖ',
  'ラ':'ﾗ','リ':'ﾘ','ル':'ﾙ','レ':'ﾚ','ロ':'ﾛ',
  'ワ':'ﾜ','ヲ':'ｦ','ン':'ﾝ',
  'ガ':'ｶﾞ','ギ':'ｷﾞ','グ':'ｸﾞ','ゲ':'ｹﾞ','ゴ':'ｺﾞ',
  'ザ':'ｻﾞ','ジ':'ｼﾞ','ズ':'ｽﾞ','ゼ':'ｾﾞ','ゾ':'ｿﾞ',
  'ダ':'ﾀﾞ','ヂ':'ﾁﾞ','ヅ':'ﾂﾞ','デ':'ﾃﾞ','ド':'ﾄﾞ',
  'バ':'ﾊﾞ','ビ':'ﾋﾞ','ブ':'ﾌﾞ','ベ':'ﾍﾞ','ボ':'ﾎﾞ',
  'パ':'ﾊﾟ','ピ':'ﾋﾟ','プ':'ﾌﾟ','ペ':'ﾍﾟ','ポ':'ﾎﾟ',
  'ァ':'ｧ','ィ':'ｨ','ゥ':'ｩ','ェ':'ｪ','ォ':'ｫ',
  'ッ':'ｯ','ャ':'ｬ','ュ':'ｭ','ョ':'ｮ',
  'ヴ':'ｳﾞ','・':'･','ー':'ｰ',
};
function toHalfKana(str) {
  return [...str].map(c => HALF_KANA_MAP[c] ?? c).join('');
}
function fitTeamName(name) {
  // 英語表示はここでは縮めない。描画後に fitSchedNames() が「実際に入るか」を測って縮める
  if (LANG !== 'ja') return name;
  if (window.innerWidth >= 600) return name;
  const fw = [...name].filter(c => c.charCodeAt(0) >= 0x30A0 && c.charCodeAt(0) <= 0x30FF).length;
  return fw >= 8 ? toHalfKana(name) : name;
}

// ライブの経過時間：ESPNの値は取得した瞬間のもの（自動更新は60秒おき＋ESPN側の遅れ）なので、
// 取得してからの経過分を足して表示する。前半は45'、後半は90'を超えたら「45'+2'」の形にする。
// 「HT」や「45'+2'」などESPNが分数以外を返している時、延長戦（period 3以降）は、ESPNの表示をそのまま出す。
// 今の推定分数（分数で表せない時は null）
// ── ライブ照合 ──
// 日程(scoreboard)の応答は試合ごとに古いまま固まることがあり、他の試合はライブで動いているのに
// 2時間前に始まった試合が「ライブ」のまま残った（2026-10-20 実機）。
// 開始から STALE_LIVE_MIN 分以上たっても試合中の試合だけ、試合単位の状態・スコア（数百バイトの小さなデータ）を
// 別の取得口(sports.core)から取り直して照合する。端末の時計は「照合するかどうか」にだけ使い、状態は決めつけない
// （延長戦などで本当に続いていれば、照合結果も試合中のまま）。
const STALE_LIVE_MIN = 115;   // 90分＋ハーフタイム15分＋追加時間の目安
const liveCheckedAt = {};
async function verifyStaleLive() {
  const now = Date.now();
  const sus = allMatches.filter(m => m.state === 'in' && m.lgCode
    && now - new Date(m.utcDate).getTime() > STALE_LIVE_MIN * 60000
    && now - (liveCheckedAt[m.id] || 0) > 50_000);
  if (!sus.length) return false;
  let changed = false;
  await mapPool(sus, 6, async m => {
    liveCheckedAt[m.id] = Date.now();
    try {
      const base = `${ESPN_CORE}/${m.lgCode}/events/${m.id}/competitions/${m.id}`;
      const score = id => id ? fetchJson(`${base}/competitors/${id}/score`, { retries: 1 }).catch(() => null) : null;
      const [st, hs, as] = await Promise.all([fetchJson(`${base}/status`, { retries: 1 }), score(m.homeId), score(m.awayId)]);
      const type = st.type || {};
      const upd = { ...m, state: type.completed === true ? 'post' : (type.state || m.state),
                    clock: st.displayClock || m.clock, period: st.period ?? m.period, fetchedAt: Date.now() };
      if (hs?.displayValue != null && as?.displayValue != null) { upd.homeScore = hs.displayValue; upd.awayScore = as.displayValue; }
      if (applyMonotonic(upd) === upd &&
          (upd.state !== m.state || upd.homeScore !== m.homeScore || upd.awayScore !== m.awayScore || upd.clock !== m.clock)) changed = true;
    } catch {}
  });
  if (changed) allMatches = allMatches.map(m => matchBest[m.id] || m);
  return changed;
}

function liveMinute(m) {
  const mm = String(m.clock || '').match(/^(\d+)'?$/);
  if (!mm || !(m.period === 1 || m.period === 2) || !m.fetchedAt) return null;
  const add = Math.min(15, Math.max(0, Math.floor((Date.now() - m.fetchedAt) / 60000)));   // 通信が止まっても暴走しないよう最大15分
  return parseInt(mm[1], 10) + add;
}
function liveClockText(m) {
  const minute = liveMinute(m);
  if (minute == null) return String(m.clock || '').replace(':00', "'");
  const base = parseInt(String(m.clock).match(/^(\d+)/)[1], 10);
  const cap = m.period === 1 ? 45 : 90;
  if (base <= cap && minute > cap) return `${cap}'+${minute - cap}'`;
  return `${minute}'`;
}
// 表示中のライブの経過時間だけを書き換える（表全体は作り直さない）
function updateLiveClocks() {
  const live = allMatches.filter(m => m.state === 'in');
  if (!live.length) return;
  const byId = Object.fromEntries(live.map(m => [String(m.id), m]));
  document.querySelectorAll('.t-live[data-mid]').forEach(el => {
    const m = byId[el.dataset.mid], s = el.querySelector('.live-min');
    if (m && s) s.textContent = liveClockText(m);
  });
}
setInterval(updateLiveClocks, 10_000);

function scheduleRow(m) {
  const cl = toHalfKana(m.shortLabel);
  const hb = m.homeLogo ? `<img class="badge" src="${attr(m.homeLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
  const ab = m.awayLogo ? `<img class="badge" src="${attr(m.awayLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
  const hn = fitTeamName(m.homeTeam);
  const an = fitTeamName(m.awayTeam);
  // 英語表示用：実測フィット(fitSchedNames)が使う候補（正式名→公式短縮名→公式略号）
  // 日本語は従来どおり fitTeamName の結果（長い名前は半角カナ）を基準にし、それでも入らない時だけ横幅を詰める。
  // 英語は 正式名→公式短縮名→横幅を詰める。
  const fitAttrs = (shown, short) => LANG === 'ja'
    ? ` data-full="${attr(shown)}"`
    : ` data-full="${attr(shown)}"${short ? ` data-short="${attr(short)}"` : ''}`;
  const hAttrs = fitAttrs(hn, m.homeShort);
  const aAttrs = fitAttrs(an, m.awayShort);
  let timeEl;
  if (m.state === 'post') timeEl = `<span class="t-fin">${LANG==='ja'?'終了':'FT'}</span>`;
  else if (m.state === 'in') timeEl = `<span class="t-live" data-mid="${attr(m.id)}"><span class="live-dot"></span><span class="live-min">${esc(liveClockText(m))}</span></span>`;
  else timeEl = `<span class="t-pre${m.isLate?' late':''}">${m.displayTime}</span>`;
  const scoreEl = m.homeScore != null
    ? `<span class="score-num">${esc(m.homeScore)}-${esc(m.awayScore)}</span>`
    : `<span class="score-vs">vs</span>`;
  const sc = `<td class="td-score"><div class="score-inner">${timeEl}${scoreEl}<span class="score-comp" style="color:${attr(m.leagueColor)};font-weight:700">${esc(cl)}</span></div></td>`;
  return `<tr${m.state==='in'?' class="live-row"':''} data-mid="${attr(m.id)}" data-lg="${attr(m.lgCode || '')}"><td class="td-home"><span class="team-inner">${hb}<span class="tn"${hAttrs}>${esc(hn)}</span></span></td>${sc}<td class="td-away"><span class="team-inner">${ab}<span class="tn"${aAttrs}>${esc(an)}</span></span></td></tr>`;
}

// 英語表示：クラブ名が列に「実際に入るか」を画面上で測り、入らない時だけ段階的に縮める。
// 文字数での決め打ちは、端末ごとに文字の大きさ（iPhoneの拡大率やフォント）が違うため当てにならない。
//   正式名 → 公式短縮名 → 横幅を詰める（英字の「半角化」＝日本語の半角カナと同じ発想）
//   「…」で切らない。"MUN" のような略号は誰のことか分からないので使わない
function fitSchedNames() {
  const over = el => el.scrollWidth > el.clientWidth + 1;
  // 文字の横幅だけを圧縮して列にぴったり収める。minRatio より細くなる場合は false（次の手へ）
  const squeeze = (el, minRatio) => {
    const txt = el.textContent;
    const span = document.createElement('span');
    span.className = 'tn-sq';
    span.textContent = txt;
    el.textContent = '';
    el.appendChild(span);
    const ratio = (el.clientWidth / span.offsetWidth) * 0.99;
    if (ratio >= 1) { el.textContent = txt; return true; }
    if (ratio < minRatio) { el.textContent = txt; return false; }
    span.style.transform = `scaleX(${ratio.toFixed(3)})`;
    el.style.textAlign = 'left';        // 列幅ぴったりに広がるので左基準で置く
    el.style.textOverflow = 'clip';     // 圧縮後は収まっているので「…」を出させない
    return true;
  };
  document.querySelectorAll('.tbl.sched .tn[data-full]').forEach(el => {
    if (!el.clientWidth) return;   // 日程ページが非表示の間は測れない（表示された時に測り直す）
    el.style.fontSize = ''; el.style.textAlign = ''; el.style.textOverflow = '';
    const full = el.dataset.full, s = el.dataset.short;
    el.textContent = full;
    if (!over(el)) return;                          // ① 正式名がそのまま入る
    if (squeeze(el, 0.85)) return;                  // ② 少し詰めれば正式名が入る（15%以内）
    if (s && s.length < full.length) {
      el.textContent = s;
      if (!over(el)) return;                        // ③ 公式短縮名が入る
      if (squeeze(el, 0.6)) return;                 // ④ 短縮名を詰める
    } else if (squeeze(el, 0.6)) return;            // ④' 短縮名が無ければ正式名を詰める
    // ⑤ それでも入らない超長名：文字を一回り小さくしてから詰める（下限なし＝必ず収まる）
    const base = parseFloat(getComputedStyle(el).fontSize) || 14;
    el.style.fontSize = (base * 0.85).toFixed(1) + 'px';
    squeeze(el, 0);
  });
}
// Webフォントの読み込み完了・画面回転/リサイズで文字幅が変わるので測り直す。
// ⚠️ 日程の文字(BIZ UDP明朝)は表が表示されてから読み込まれるので、fonts.ready（ページを開いた時点の読み込み）
//    だけでは間に合わない。スマホで初めて開いた時、代わりの細い文字で「入る」と判定されたまま、
//    本物の文字に替わって「…」になっていた。→ 文字の読み込みが終わるたび＋表示の少し後にも測り直す
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSchedNames());
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => { fitSchedNames(); pinStandingsCols(); });
}
function refitSoon() { [300, 1200, 3000].forEach(ms => setTimeout(() => { fitSchedNames(); pinStandingsCols(); }, ms)); }
// 試合日程ページだけの縮尺（英語表示）：2026-08-28〜09-19の版は、英語の長いクラブ名で表が約510pxに広がり、
// iPhoneのSafariがページ全体を自動で縮小していた（幅320pxで約63%・1画面約12試合）。その見た目を意図的に再現する。
// 日程ページの中身を「幅510px」で組み立て、実際の画面幅まで縮小する（CSSのzoom）。ヘッダー・順位表・得点ランキングは対象外。
// 画面幅は毎回実測するので、iPhoneの機種・画面表示（標準/拡大）・Safariのページ拡大率に関係なく同じ見た目になる。
// 横向きと510px以上の画面は縮小しない。日本語表示は当時も94%でほぼ縮小されていなかったので対象外。
const SCHED_DESIGN_W = 420;   // 510(約63%)は小さすぎ→460(約70%)→さらに少し大きく（幅320pxで約76%）
function applySchedScale() {
  const page = document.getElementById('schedulePage');
  if (!page) return;
  const w = document.documentElement.clientWidth;
  const landscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
  const z = (LANG !== 'ja' && !landscape && w < SCHED_DESIGN_W) ? w / SCHED_DESIGN_W : 1;
  page.style.zoom = z === 1 ? '' : z.toFixed(4);
}
applySchedScale();
let _fitT = null;
