async function fetchStandings(code) {
  const res = await fetch(`${ESPN_STND}/${code}/standings?lang=ja&region=jp`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function parseStandings(data) {
  const entries = data.children?.[0]?.standings?.entries || data.standings?.entries || [];
  return entries.map(e => {
    const s = {};
    (e.stats||[]).forEach(st => { s[st.name] = st.value; });
    return {
      rank:   Math.round(s.rank||0),
      team:   teamNameJa(e.team?.displayName || e.team?.shortDisplayName || '?'),
      teamEn: e.team?.displayName || e.team?.shortDisplayName || '?',
      logo:   e.team?.logos?.[0]?.href || null,
      gp: Math.round(s.gamesPlayed||0), w: Math.round(s.wins||0),
      d:  Math.round(s.ties||0),        l: Math.round(s.losses||0),
      gf: Math.round(s.pointsFor||0),   ga: Math.round(s.pointsAgainst||0),
      gd: Math.round(s.pointDifferential||0), pts: Math.round(s.points||0),
      noteColor: normColor(e.note?.color), noteDesc: e.note?.description || null,
    };
  }).sort((a,b) => a.rank - b.rank);
}

/* ════════════════════════════════════════
   CL / EL ノックアウトステージ
════════════════════════════════════════ */
const CUP_KO_CODES = new Set(['uefa.champions','uefa.europa','uefa.europa.conf','fifa.world']);
const koCache = {};

const KO_ROUND_ORDER = ['round-of-32','round-of-16','quarterfinals','semifinals','final'];
const KO_ROUND_JA = {
  'round-of-32':  'ベスト32',
  'round-of-16':  'ベスト16',
  'quarterfinals':'準々決勝',
  'semifinals':   '準決勝',
  'final':        '決勝',
};

/* ラウンド識別（slugが無い場合はイベント名から推定） */
function slugFromEvent(e) {
  if (KO_ROUND_ORDER.includes(e.season?.slug)) return e.season.slug;
  // competition.notes が最も信頼できるラウンド情報源
  const compNotes = (e.competitions?.[0]?.notes || []).map(n => n.text||n.headline||'').join(' ');
  const compType  = e.competitions?.[0]?.type?.text || '';
  const evtNotes  = (e.notes||[]).map(n => n.text||n.headline||'').join(' ');
  const txt = ((e.name||'') + ' ' + compNotes + ' ' + compType + ' ' + evtNotes).toLowerCase();
  // 英語 + 日本語パターン
  if ((/\bfinal\b|決勝/.test(txt)) && !(/semi|quarter|準々|準決/.test(txt))) return 'final';
  if (/semi.?final|semifinal|準決勝/.test(txt))   return 'semifinals';
  if (/quarter.?final|quarterfinal|準々決勝/.test(txt)) return 'quarterfinals';
  if (/round.of.16|last.?16|\br16\b|ベスト16|16強/.test(txt))  return 'round-of-16';
  if (/round.of.32|last.?32|ベスト32|32強/.test(txt))           return 'round-of-32';
  if (e._koGuessed) return e._koGuessed;
  return null;
}

async function fetchKnockoutEvents(code) {
  const season = currentSeason();
  const year   = season + 1;

  const isKO = e => e.competitions?.[0]?.competitors?.length >= 2;

  // 試み① seasontype=3（ノックアウト専用）
  try {
    const r = await fetch(`${ESPN_SCHED}/${code}/scoreboard?seasontype=3&limit=200`);
    if (r.ok) {
      const d = await r.json();
      const evts = (d.events||[]).filter(isKO);
      if (evts.length) return evts;
    }
  } catch {}

  // 試み② 日付範囲クエリ
  try {
    const from = `${year}0101`, to = `${year}0701`;
    const r = await fetch(`${ESPN_SCHED}/${code}/scoreboard?dates=${from}-${to}&limit=500&lang=ja&region=jp`);
    if (r.ok) {
      const d = await r.json();
      const evts = (d.events||[]).filter(e => slugFromEvent(e));
      if (evts.length) return evts;
    }
  } catch {}

  // 試み③ 日付なしクエリ
  try {
    const r = await fetch(`${ESPN_SCHED}/${code}/scoreboard?limit=100&lang=ja&region=jp`);
    if (r.ok) {
      const d = await r.json();
      const evts = (d.events||[]).filter(e => slugFromEvent(e));
      if (evts.length) return evts;
    }
  } catch {}

  // 試み④ 個別日付（火〜木・土）
  const dates = [];
  for (let m = 1; m <= 5; m++) {
    for (let day = 1; day <= 31; day++) {
      const d = new Date(year, m, day);
      if (d.getMonth() !== m) break;
      const dow = d.getDay();
      if (dow === 2 || dow === 3 || dow === 4 || dow === 6)
        dates.push(d.toISOString().slice(0,10).replace(/-/g,''));
    }
  }
  const seen = new Set(), events = [];
  for (let i = 0; i < dates.length; i += 8) {
    const results = await Promise.all(dates.slice(i, i+8).map(async dt => {
      try {
        const r = await fetch(`${ESPN_SCHED}/${code}/scoreboard?dates=${dt}&limit=20&lang=ja&region=jp`);
        return r.ok ? (await r.json()).events || [] : [];
      } catch { return []; }
    }));
    results.flat().forEach(e => {
      if (e.id && !seen.has(e.id) && slugFromEvent(e)) {
        seen.add(e.id); events.push(e);
      }
    });
  }
  return events;
}

function parseKnockoutEvents(events) {
  const rounds = {};
  for (const evt of events) {
    const slug = slugFromEvent(evt);
    if (!slug) continue;
    const comp = evt.competitions?.[0];
    if (!comp) continue;
    const comps = comp.competitors || [];
    if (comps.length < 2) continue;

    const home = comps.find(c => c.homeAway === 'home') || comps[0];
    const away = comps.find(c => c.homeAway === 'away') || comps[1];
    const seriesComps = comp.series?.competitors || [];
    const homeWin = seriesComps.find(s => s.id === home.id)?.winner ?? false;
    const awayWin = seriesComps.find(s => s.id === away.id)?.winner ?? false;
    const key   = [home.id, away.id].sort().join('-');
    const evtId = evt.id || evt.date;   // イベントIDで重複排除（leg番号に頼らない）
    const note  = (comp.notes || []).find(n => n.type === 'event')?.text || '';
    const fin   = ['STATUS_FINAL','STATUS_FULL_TIME'].includes(evt.status?.type?.name);

    if (!rounds[slug]) rounds[slug] = {};
    if (!rounds[slug][key]) {
      rounds[slug][key] = {
        homeId:     home.id,
        awayId:     away.id,
        homeName:   teamNameJa(home.team?.displayName || home.team?.shortDisplayName || '?'),
        awayName:   teamNameJa(away.team?.displayName || away.team?.shortDisplayName || '?'),
        homeNameEn: home.team?.displayName || home.team?.shortDisplayName || '?',
        awayNameEn: away.team?.displayName || away.team?.shortDisplayName || '?',
        homeLogo:   home.team?.logo || null,
        awayLogo:   away.team?.logo || null,
        legs: [], homeWin: false, awayWin: false,
      };
    }
    const tie = rounds[slug][key];
    tie.homeWin = tie.homeWin || homeWin;
    tie.awayWin = tie.awayWin || awayWin;
    // イベントIDで重複チェック（leg番号が全て1でも複数戦を正しく保存）
    if (!tie.legs.find(l => l.evtId === evtId)) {
      tie.legs.push({
        evtId,
        homeScore: fin ? (parseInt(home.score) || 0) : null,
        awayScore: fin ? (parseInt(away.score) || 0) : null,
        fin, note,
        date: evt.date,
      });
    }
  }

  return KO_ROUND_ORDER
    .filter(slug => rounds[slug])
    .map(slug => ({
      slug,
      label: KO_ROUND_JA[slug] || slug,
      ties: Object.values(rounds[slug]).map(t => ({
        ...t,
        // 日付順にソートして第1戦・第2戦を再採番
        legs: t.legs
          .sort((a, b) => new Date(a.date) - new Date(b.date))
          .map((l, i) => ({ ...l, leg: i + 1 })),
      })),
    }));
}

/* ── ノックアウト HTML 生成（文字列を返す） ── */
function buildKnockoutHtml(rounds) {
  if (!rounds.length) return '';

  function teamSpan(nameJa, nameEn) {
    if (adminMode && nameEn)
      return `<span class="admin-name" data-en="${attr(nameEn)}" data-type="team" title="クリックで編集">${esc(nameJa)}</span>`;
    return esc(nameJa);
  }

  let html = `<div class="sec-head" style="margin-top:24px">
    <span class="sec-title">ノックアウトステージ</span>
    <span class="sec-cnt">ベスト16〜</span>
  </div>`;
  for (const round of rounds) {
    html += `<div class="ko-round"><div class="ko-round-head">${esc(round.label)}</div>`;
    for (const tie of round.ties) {
      const legs    = tie.legs;
      const isFinal = round.slug === 'final';
      const winner  = tie.homeWin ? tie.homeName : tie.awayWin ? tie.awayName : null;
      const hSpan   = teamSpan(tie.homeName, tie.homeNameEn);
      const aSpan   = teamSpan(tie.awayName, tie.awayNameEn);
      html += `<div class="ko-tie">`;
      for (const leg of legs) {
        const label  = isFinal ? '決勝' : `第${leg.leg}戦`;
        const hScore = leg.fin && leg.homeScore !== null ? leg.homeScore : '–';
        const aScore = leg.fin && leg.awayScore !== null ? leg.awayScore : '–';
        const hCls   = tie.homeWin ? ' winner' : '';
        const aCls   = tie.awayWin ? ' winner' : '';
        html += `<div class="ko-leg">
          <span class="ko-leg-num">${esc(label)}</span>
          <span class="ko-team${hCls}">${hSpan}</span>
          <span class="ko-score-box">${hScore}<span class="ko-score-sep">-</span>${aScore}</span>
          <span class="ko-team right${aCls}">${aSpan}</span>
        </div>`;
      }
      if (!isFinal && legs.length >= 2 && legs.every(l => l.fin)) {
        const homeAgg = legs.reduce((s,l) => s + (l.homeScore||0), 0);
        const awayAgg = legs.reduce((s,l) => s + (l.awayScore||0), 0);
        const note    = legs[legs.length-1].note;
        html += `<div class="ko-agg">
          <span class="ko-note">${note ? esc(note) : ''}</span>
          <span class="${winner ? 'ko-agg-winner' : ''}">${winner ? esc(winner) + ' が突破' : `${homeAgg} – ${awayAgg}（合計）`}</span>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  return html;
}

// 順位表の固定列（色帯・順位・クラブ名）の left を実測で設定する。
// 列幅は画面幅・見出しの余白で変わるので決め打ちせず、描画後に測る
const STND_MIN_VISIBLE_COLS = 5;   // スライドしなくても見える数字の列数（勝点・試・勝・分・負）
function pinStandingsCols() {
  document.querySelectorAll('.stnd-scroll .tbl.stnd').forEach(t => {
    const zone = t.querySelector('thead .zone-bar'), rank = t.querySelector('thead .stnd-rank');
    if (!zone || !rank || !t.offsetWidth) return;   // 非表示中は測れない（色帯の列は幅0のことがあるので表全体で判定）

    // ① 長いクラブ名の横幅を詰めて、数字の列が最低5列スライドなしで見えるようにする（「…」では切らない）
    const names = [...t.querySelectorAll('tbody .st-nm')];
    names.forEach(n => {   // いったん元に戻してから測る（画面回転などで測り直すため）
      n.style.width = ''; n.classList.remove('st-nm-fit');
      const sq = n.querySelector(':scope > .tn-sq'); if (sq) { while (sq.firstChild) n.insertBefore(sq.firstChild, sq); sq.remove(); }
    });
    const heads = [...t.querySelectorAll('thead th')];
    const need = heads.slice(3, 3 + STND_MIN_VISIBLE_COLS).reduce((s, h) => s + h.getBoundingClientRect().width, 0);
    const box = t.parentElement.clientWidth;
    const teamW = heads[2].getBoundingClientRect().width;
    const maxTeam = Math.floor(box - zone.getBoundingClientRect().width - rank.getBoundingClientRect().width - need);
    if (names.length && teamW > maxTeam) {
      const widths = names.map(n => n.getBoundingClientRect().width);
      const cap = Math.max(40, Math.floor(maxTeam - (teamW - Math.max(...widths))));   // 名前に使える幅
      names.forEach((n, i) => {
        if (widths[i] <= cap) return;
        const sq = document.createElement('span');
        sq.className = 'tn-sq';
        while (n.firstChild) sq.appendChild(n.firstChild);
        n.appendChild(sq);
        n.classList.add('st-nm-fit');
        n.style.width = cap + 'px';
        sq.style.transform = `scaleX(${(cap / widths[i] * 0.99).toFixed(3)})`;
      });
    }

    const zw = zone.getBoundingClientRect().width, rw = rank.getBoundingClientRect().width;
    t.querySelectorAll('.stnd-rank').forEach(c => { c.style.left = zw + 'px'; });
    t.querySelectorAll('.stnd-team').forEach(c => { c.style.left = (zw + rw) + 'px'; });
  });
}
window.addEventListener('resize', () => requestAnimationFrame(pinStandingsCols));

/* ════════════════════════════════════════
   トーナメントブラケット描画（SVGライン方式）
════════════════════════════════════════ */
function buildBracketHtml(rounds) {
  _bracketConns = [];
  const get = slug => rounds.find(r => r.slug === slug)?.ties || [];
  const r16 = get('round-of-16');
  const qf  = get('quarterfinals');
  const sf  = get('semifinals');
  const fin = get('final');

  if (!r16.length && !qf.length && !sf.length && !fin.length)
    return `<div class="state"><span class="ico">🏆</span>${LANG==='ja'?'トーナメントデータがありません':'No tournament data'}</div>`;

  // Which columns to show (cascading: showing a later round implies all prior rounds too)
  const showR16 = r16.length > 0;
  const showQF  = showR16 || qf.length > 0;
  const showSF  = showQF  || sf.length > 0;

  // nPS = match slots per side in the first (outermost) column
  const nPS = showR16 ? Math.max(4, Math.ceil(r16.length / 2))
            : showQF  ? Math.max(2, Math.ceil(qf.length / 2))
            : 1;

  // fill: pad array with nulls to length n
  const fill = (arr, n) => { const a = [...arr]; while (a.length < n) a.push(null); return a; };

  // Build each half's column data (nulls for undecided/future matches)
  const lR16 = showR16 ? fill(r16.slice(0, Math.ceil(r16.length / 2)), nPS)            : [];
  const rR16 = showR16 ? fill(r16.slice(Math.ceil(r16.length / 2)),    nPS)            : [];
  const lQF  = showQF  ? fill(qf.slice(0, Math.ceil(qf.length / 2)),   Math.ceil(nPS / 2)) : [];
  const rQF  = showQF  ? fill(qf.slice(Math.ceil(qf.length / 2)),      Math.ceil(nPS / 2)) : [];
  const lSF  = showSF  ? fill(sf.slice(0, 1), 1) : [];
  const rSF  = showSF  ? fill(sf.slice(1, 2), 1) : [];

  const BH     = 56;          // match box height (2 rows × 28px)
  const totalH = nPS * BH;   // total bracket height

  function agg(t) {
    if (!t?.legs.length) return null;
    let h = 0, a = 0, ok = false;
    for (const l of t.legs) { if (l.fin) { h += l.homeScore||0; a += l.awayScore||0; ok = true; } }
    return ok ? {h, a} : null;
  }

  function mHtml(t, bid) {
    if (!t) return `<div class="bc-match" data-bid="${bid}"><div class="bc-team"></div><div class="bc-team"></div></div>`;
    const sc = agg(t);
    const hSc = sc != null ? `<span class="bc-sc">${sc.h}</span>` : '';
    const aSc = sc != null ? `<span class="bc-sc">${sc.a}</span>` : '';
    return `<div class="bc-match" data-bid="${bid}"><div class="bc-team"><span class="bc-name">${esc(t.homeName)}</span>${hSc}</div><div class="bc-team"><span class="bc-name">${esc(t.awayName)}</span>${aSc}</div></div>`;
  }

  function colHtml(matches, bids) {
    const cnt  = matches.length;
    const span = totalH / cnt;
    const hs   = span / 2 - BH / 2;
    const gap  = span - BH;
    let html = `<div class="bc-col">`;
    for (let i = 0; i < cnt; i++) {
      html += `<div class="bc-spacer" style="height:${Math.max(0, i === 0 ? hs : gap)}px"></div>`;
      html += mHtml(matches[i], bids[i]);
    }
    html += `<div class="bc-spacer" style="height:${Math.max(0, hs)}px"></div></div>`;
    return html;
  }

  // Bid (data-bid) arrays — nulls in matches still get a unique bid
  const lR16B = lR16.map((_, i) => `l-r16-${i}`);
  const rR16B = rR16.map((_, i) => `r-r16-${i}`);
  const lQFB  = lQF.map((_,  i) => `l-qf-${i}`);
  const rQFB  = rQF.map((_,  i) => `r-qf-${i}`);
  const lSFB  = lSF.map((_,  i) => `l-sf-${i}`);
  const rSFB  = rSF.map((_,  i) => `r-sf-${i}`);

  // Register bracket connections (SVG lines drawn after DOM insert)
  // Left: R16 → QF → SF → Final
  for (let i = 0; i < lQF.length; i++)
    _bracketConns.push({src1: lR16B[i*2], src2: lR16B[i*2+1], tgt: lQFB[i], side: 'left'});
  for (let i = 0; i < lSF.length; i++)
    _bracketConns.push({src1: lQFB[i*2],  src2: lQFB[i*2+1],  tgt: lSFB[i], side: 'left'});
  if      (lSF.length)  _bracketConns.push({src1: lSFB[0],  src2: null, tgt: 'final', side: 'left'});
  else if (lQF.length)  _bracketConns.push({src1: lQFB[0],  src2: null, tgt: 'final', side: 'left'});
  else if (lR16.length) _bracketConns.push({src1: lR16B[0], src2: null, tgt: 'final', side: 'left'});
  // Right: R16 → QF → SF → Final
  for (let i = 0; i < rQF.length; i++)
    _bracketConns.push({src1: rR16B[i*2], src2: rR16B[i*2+1], tgt: rQFB[i], side: 'right'});
  for (let i = 0; i < rSF.length; i++)
    _bracketConns.push({src1: rQFB[i*2],  src2: rQFB[i*2+1],  tgt: rSFB[i], side: 'right'});
  if      (rSF.length)  _bracketConns.push({src1: rSFB[0],  src2: null, tgt: 'final', side: 'right'});
  else if (rQF.length)  _bracketConns.push({src1: rQFB[0],  src2: null, tgt: 'final', side: 'right'});
  else if (rR16.length) _bracketConns.push({src1: rR16B[0], src2: null, tgt: 'final', side: 'right'});

  // Final column (center)
  const f   = fin[0] || null;
  const sc  = f ? agg(f) : null;
  const hN  = f ? f.homeName : '';
  const aN  = f ? f.awayName : '';
  const hSc = sc != null ? `<span class="bc-sc">${sc.h}</span>` : '';
  const aSc = sc != null ? `<span class="bc-sc">${sc.a}</span>` : '';
  const fhs = Math.max(0, totalH / 2 - BH / 2);
  const finalHtml = `<div class="bc-final-col">
    <div class="bc-spacer" style="height:${fhs}px"></div>
    <div class="bc-match" data-bid="final">
      <div class="bc-team"><span class="bc-name">${esc(hN)}</span>${hSc}</div>
      <div class="bc-team"><span class="bc-name">${esc(aN)}</span>${aSc}</div>
    </div>
    <div class="bc-trophy">🏆</div>
  </div>`;

  let html = '<div class="bracket-outer"><div class="bracket-wrap" id="bcWrap">';
  html += '<div class="bc-half left">';
  if (lR16.length) html += colHtml(lR16, lR16B);
  if (lQF.length)  html += colHtml(lQF,  lQFB);
  if (lSF.length)  html += colHtml(lSF,  lSFB);
  html += '</div>';
  html += finalHtml;
  html += '<div class="bc-half right">';
  if (rSF.length)  html += colHtml(rSF,  rSFB);
  if (rQF.length)  html += colHtml(rQF,  rQFB);
  if (rR16.length) html += colHtml(rR16, rR16B);
  html += '</div>';
  html += '<svg class="bc-svg" id="bcSvg"></svg>';
  html += '</div></div>';
  return html;
}

function drawBracketLines() {
  const wrap = document.getElementById('bcWrap');
  const svg  = document.getElementById('bcSvg');
  if (!wrap || !svg) return;
  const wr = wrap.getBoundingClientRect();
  if (wr.width === 0) { requestAnimationFrame(drawBracketLines); return; }
  svg.innerHTML = '';

  const STROKE = '#cbd5e1';
  function ln(x1,y1,x2,y2) {
    const el = document.createElementNS('http://www.w3.org/2000/svg','line');
    el.setAttribute('x1',x1.toFixed(1)); el.setAttribute('y1',y1.toFixed(1));
    el.setAttribute('x2',x2.toFixed(1)); el.setAttribute('y2',y2.toFixed(1));
    el.setAttribute('stroke',STROKE); el.setAttribute('stroke-width','1.5');
    svg.appendChild(el);
  }

  for (const conn of _bracketConns) {
    const tEl = wrap.querySelector(`[data-bid="${conn.tgt}"]`);
    if (!tEl) continue;
    const tr = tEl.getBoundingClientRect();
    const tY = tr.top + tr.height/2 - wr.top;
    const s1El = conn.src1 ? wrap.querySelector(`[data-bid="${conn.src1}"]`) : null;
    const s2El = conn.src2 ? wrap.querySelector(`[data-bid="${conn.src2}"]`) : null;
    if (!s1El && !s2El) continue;

    if (conn.side === 'left') {
      const tX = tr.left - wr.left;
      if (s1El && s2El) {
        const r1=s1El.getBoundingClientRect(), r2=s2El.getBoundingClientRect();
        const y1=r1.top+r1.height/2-wr.top, y2=r2.top+r2.height/2-wr.top;
        const x1=r1.right-wr.left, x2=r2.right-wr.left;
        const xb=(Math.max(x1,x2)+tX)/2;
        ln(x1,y1,xb,y1); ln(x2,y2,xb,y2); ln(xb,y1,xb,y2); ln(xb,(y1+y2)/2,tX,tY);
      } else {
        const e=(s1El||s2El).getBoundingClientRect();
        ln(e.right-wr.left, e.top+e.height/2-wr.top, tX, tY);
      }
    } else {
      const tX = tr.right - wr.left;
      if (s1El && s2El) {
        const r1=s1El.getBoundingClientRect(), r2=s2El.getBoundingClientRect();
        const y1=r1.top+r1.height/2-wr.top, y2=r2.top+r2.height/2-wr.top;
        const x1=r1.left-wr.left, x2=r2.left-wr.left;
        const xb=(Math.min(x1,x2)+tX)/2;
        ln(x1,y1,xb,y1); ln(x2,y2,xb,y2); ln(xb,y1,xb,y2); ln(xb,(y1+y2)/2,tX,tY);
      } else {
        const e=(s1El||s2El).getBoundingClientRect();
        ln(e.left-wr.left, e.top+e.height/2-wr.top, tX, tY);
      }
    }
  }
}

// 得点・アシストの上位を「選手名つきで1回」で取る（site API の statistics）。
// 以前は順位(leaders)を取ってから選手ごとに名前を約50回取りに行っており、スマホだと特に遅かった。
// 2026-10-22 に7大会(5大リーグ+CL+EL)で、旧方式と名前・数字・順番・所属が完全に一致することを確認済み。
// 取れなかった時だけ旧方式(fetchScorersCore)に戻る。
const SCORER_ROWS = 25;   // 旧方式(leaders)が返す人数と同じ（表示人数は変えない）
async function fetchScorers(code) {
  try {
    const d = await fetchJson(`${ESPN_SCHED}/${code}/statistics`, { retries: 1 });
    const cat = n => (d.stats || []).find(x => x.name === n)?.leaders;
    const g = cat('goalsLeaders'), a = cat('assistsLeaders');
    if (Array.isArray(g) && Array.isArray(a) && (g.length || a.length)) {
      const conv = list => rankScorerList(list.slice(0, SCORER_ROWS).map(l => ({
        id: l.athlete?.id || null,
        nameEn: l.athlete?.displayName || l.athlete?.shortName || '', teamId: l.athlete?.team?.id || null,
        value: l.value, displayValue: l.displayValue,
      })));
      return { goals: conv(g), assists: conv(a) };
    }
  } catch {}
  return fetchScorersCore(code);
}
function rankScorerList(items) {
  const list = items.map(x => {
    const mmt = (x.displayValue || '').match(/Matches:\s*(\d+)/);
    return {
      rank: 0,
      id: x.id || null,
      teamId: x.teamId || null,
      name: x.nameEn ? playerNameJa(x.nameEn) : '?',
      nameEn: x.nameEn || '',
      teamLogo: x.teamId ? `https://a.espncdn.com/i/teamlogos/soccer/500/${x.teamId}.png` : null,
      value: Math.round(x.value),
      matches: mmt ? parseInt(mmt[1]) : 0,
    };
  });
  // 同値同順位（例: 8点が2人なら両者2位、次は4位）
  for (let i = 0; i < list.length; i++) list[i].rank = (i > 0 && list[i].value === list[i-1].value) ? list[i-1].rank : i + 1;
  return list;
}

// 旧方式（予備）：順位(leaders) → 選手ごとに名前を取得
async function fetchScorersCore(code) {
  const season = currentSeason();
  const res    = await fetch(`${ESPN_CORE}/${code}/seasons/${season}/types/1/leaders`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();

  const goalsCat   = data.categories?.find(c => c.name === 'goalsLeaders');
  const assistsCat = data.categories?.find(c => c.name === 'assistsLeaders');
  const gLeaders   = (goalsCat?.leaders   || []).slice(0, TOP_N);
  const aLeaders   = (assistsCat?.leaders || []).slice(0, TOP_N);

  // 選手IDを収集して一括フェッチ
  const allL   = [...gLeaders, ...aLeaders];
  const aidSet = new Set(allL.map(l => extractId(l.athlete?.['$ref'], 'athletes')).filter(Boolean));
  const athMap = {};

  await Promise.all([...aidSet].map(async id => {
    try {
      const r = await fetch(`${ESPN_CORE}/${code}/seasons/${season}/athletes/${id}?lang=ja&region=jp`);
      if (r.ok) {
        const a = await r.json();
        athMap[id] = {
          nameEn: a.displayName || a.shortName || '?',
          name:   playerNameJa(a.displayName || a.shortName || '?'),
          teamId: extractId(a.team?.['$ref'], 'teams'),
        };
      }
    } catch {}
  }));

  function buildList(leaders) {
    const list = leaders.map((l, i) => {
      const aid  = extractId(l.athlete?.['$ref'], 'athletes');
      const ath  = athMap[aid] || {};
      const tid  = extractId(l.team?.['$ref'], 'teams') || ath.teamId;
      const mmt  = (l.displayValue || '').match(/Matches:\s*(\d+)/);
      return {
        rank:     0,
        id:       aid || null,
        teamId:   tid || null,
        name:     ath.name   || '?',
        nameEn:   ath.nameEn || '',
        teamLogo: tid ? `https://a.espncdn.com/i/teamlogos/soccer/500/${tid}.png` : null,
        value:    Math.round(l.value),
        matches:  mmt ? parseInt(mmt[1]) : 0,
      };
    });
    // 同値同順位（例: 8点が2人なら両者2位、次は4位）
    for (let i = 0; i < list.length; i++) {
      list[i].rank = (i > 0 && list[i].value === list[i-1].value)
        ? list[i-1].rank
        : i + 1;
    }
    return list;
  }

  return { goals: buildList(gLeaders), assists: buildList(aLeaders) };
}

// 得点ランキングの端末保存（開いた瞬間に前回の表を出し、裏で最新に差し替える）
const SCORERS_STORE_KEY = 'scorersStoreV3';   // V2: 選手ID / V3: クラブID(選手ページを速く出すため)
const SCORERS_STORE_MAX_AGE = 3 * 24 * 60 * 60 * 1000;
const SCORERS_FRESH_MS = 10 * 60 * 1000;   // これより新しい取得分は取り直さない
const scorersFetchedAt = {};
function readScorersStore() { try { return JSON.parse(localStorage.getItem(SCORERS_STORE_KEY) || '{}') || {}; } catch { return {}; } }
function saveScorersStore(code, data) {
  try {
    const st = readScorersStore();
    st[code] = { savedAt: Date.now(), goals: data.goals, assists: data.assists };
    localStorage.setItem(SCORERS_STORE_KEY, JSON.stringify(st));
  } catch {}
}
function restoreScorersStore(code) {
  const e = readScorersStore()[code];
  if (!e || !(Date.now() - e.savedAt < SCORERS_STORE_MAX_AGE) || !Array.isArray(e.goals) || !Array.isArray(e.assists)) return null;
  // 日本語名は保存後に見つかった分もあるので付け直す
  for (const list of [e.goals, e.assists]) list.forEach(p => { if (p.nameEn) p.name = playerNameJa(p.nameEn); });
  return { goals: e.goals, assists: e.assists };
}
function lookupUnregistered(data, code) {
  const seen = new Set();
  const unregistered = [...data.goals, ...data.assists].filter(p => {
    if (!p.nameEn || seen.has(p.nameEn)) return false;
    seen.add(p.nameEn);
    return !nameOverrides.players[p.nameEn] && !PLAYER_NAMES_JA[p.nameEn] && !isMissFresh(p.nameEn);
  });
  if (unregistered.length) autoLookupPlayers(unregistered, code);
}
const scorersInFlight = {};
function fetchScorersOnce(code) {
  if (!scorersInFlight[code]) {
    scorersInFlight[code] = fetchScorers(code).then(data => {
      scorersCache[code] = data;
      scorersFetchedAt[code] = Date.now();
      saveScorersStore(code, data);
      return data;
    }).finally(() => { delete scorersInFlight[code]; });
  }
  return scorersInFlight[code];
}
const isActiveScorers = code => activePage === 'scorers' && activeScorersCode === code;

async function loadScorers(code, showLoader = true) {
  setTimeout(() => { preloadPlayerFonts(); loadPosAvg(); }, 800);   // 選手ページ用の文字と平均データを先読み
  const wrap = document.getElementById('scorersWrap');
  if (scorersCache[code]) {
    renderScorers(scorersCache[code], code);
    if (Date.now() - (scorersFetchedAt[code] || 0) < SCORERS_FRESH_MS) { prefetchScorers(); return; }
  } else {
    const stored = restoreScorersStore(code);
    if (stored) { scorersCache[code] = stored; renderScorers(stored, code); }
    else if (showLoader) renderScorers(null, code);   // 見出しは残し、表の部分だけ「読み込み中」
  }
  try {
    const data = await fetchScorersOnce(code);
    if (isActiveScorers(code)) renderScorers(data, code);
    lookupUnregistered(data, code);   // 未登録選手をバックグラウンドでWikipedia検索
    prefetchScorers();

    if (scorersCache[code]) return;   // 保存分を表示中なら、そのまま出しておく
    if (isActiveScorers(code)) { wrap._lastHtml = null; wrap.innerHTML = `<div class="state"><span class="ico">⚠️</span>${T.failed}: ${esc(e.message)}</div>`; }
  }
}

async function autoLookupPlayers(players, code) {
  if (LANG !== 'ja') return;
  const seen = new Set();
  const targets = players.filter(p => {
    if (!p.nameEn || seen.has(p.nameEn)) return false;
    seen.add(p.nameEn);
    return !nameOverrides.players[p.nameEn] && !PLAYER_NAMES_JA[p.nameEn] && !isMissFresh(p.nameEn);
  });
  await mapPool(targets, LOOKUP_CONCURRENCY, async p => {
    try {
      const { ja: raw, reached } = await lookupWikipediaJaEx(p.nameEn);
      const ja = cleanJaName(raw);
      if (ja) {
        nameOverrides.players[p.nameEn] = ja;
        persistNameOverrides();   // 1人見つかるごとに即保存（途中で離脱しても消えない）
        if (scorersCache[code]) {
          for (const list of [scorersCache[code].goals, scorersCache[code].assists]) {
            list.forEach(pl => { if (pl.nameEn === p.nameEn) pl.name = ja; });
          }
        }
        scheduleScorerRerender(code);
      } else if (reached) {
        // Wikipediaに到達したが日本語名が無い → 該当なしと確定（以後は再検索せず英語表記のまま）。
        // 通信できなかった時(reached=false)は記録せず、次回に再試行する
        resolvedMiss[p.nameEn] = Date.now();   // 時刻を記録（14日で期限切れ→再検索）
        persistResolvedMiss();
      }
    } catch {}
  });
}

function renderScorers(data, code) {
  const wrap  = document.getElementById('scorersWrap');
  if (data && _touching) { _pendingScorers = [data, code]; return; }   // タップ中は作り直さない
  const lname = SCORERS_LEAGUES.find(l => l.code === code)?.label ?? '';
  const colLabel = activeScorersTab === 'goals' ? T.goals : T.assists;
  // 読み込み中は表の部分だけ差し替える（高さを保って画面が跳ねないように）
  const prevTbl = wrap.querySelector('.tbl.stnd, .scorer-loading');
  const keepH = prevTbl ? Math.round(prevTbl.getBoundingClientRect().height) : 0;
  const body = data
    ? scorerTable(activeScorersTab === 'goals' ? data.goals : data.assists, colLabel)
    : `<div class="scorer-loading state" style="min-height:${Math.max(keepH, 160)}px"><span class="ico">⚽</span>${T.loading}</div>`;
  const html = `
    <div class="sec-head">
      <button id="scorersTriggerBtn" class="sec-title">${esc(lname)} ▼</button>
    </div>
    <div class="scorer-sub-row">
      <button class="scorer-sub${activeScorersTab==='goals'?' active':''}" data-sub="goals">⚽ ${T.goals}</button>
      <button class="scorer-sub${activeScorersTab==='assists'?' active':''}" data-sub="assists">🎯 ${T.assists}</button>
    </div>
    ${body}`;
  if (wrap._lastHtml === html) return;   // 中身が同じなら作り直さない（行がずれない）
  wrap._lastHtml = html;
  wrap.innerHTML = html;
  if (data) fitScorerNames();
}

// 1位の金・2位の銀：単色だと薄いか黒っぽくなるので、上が明るく下が濃い金属調のグラデーションを文字に塗る
const GOLD_TXT = 'background-image:linear-gradient(160deg,#ecc451 0%,#d39a1d 55%,#b07a10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent';
const SILVER_TXT = 'background-image:linear-gradient(160deg,#9aa6b3 0%,#6e7a88 55%,#58636f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent';
function rankStyle(rank) {
  // 順位の数字も順位に応じて大きく（1位＞2位＞3位＞4位以下）
  if (rank === 1) return `${GOLD_TXT};font-weight:900;font-size:17px`;
  if (rank === 2) return `${SILVER_TXT};font-weight:800;font-size:16px`;   // 順位の数字も銀色（文字に金属っぽいグラデーション）
  if (rank === 3) return 'color:#b45309;font-weight:800;font-size:15px';
  return 'color:var(--muted);font-weight:700;font-size:13px';
}

function nameStyle(rank) {
  // 書体は全順位で1位と同じ「BIZ UDP明朝の太字」にそろえる（2026-10-22 ユーザー指示）。
  // この書体は太さ400と700の2つしか読み込まないため、500にすると細い別の明朝に切り替わり、別のフォントに見えていた
  // 1〜3位は大きくした枠に合わせて名前も大きく（順位が上ほど大きい）。1位の金・2位の銀は名前の文字(.nm-gold/.nm-silver)に塗る
  if (rank === 1) return 'font-weight:700;font-size:16.5px';
  if (rank === 2) return 'font-weight:700;font-size:15.5px';
  if (rank === 3) return 'color:#92400e;font-weight:700;font-size:14.5px';
  return 'color:var(--text);font-weight:700;font-size:13px';
}

function scorerTable(players, colLabel) {
  if (!players.length) return '<p style="color:var(--muted);font-size:13px;padding:8px 0">データなし</p>';
  const rows = players.map(p => {
    const tl = p.teamLogo ? `<img class="badge" src="${attr(p.teamLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    const nameCell = adminMode && p.nameEn
      ? `<span class="admin-name" data-en="${attr(p.nameEn)}" title="クリックで編集">${esc(p.name)}</span>`
      : p.id
        ? `<a class="pl-link${p.rank === 1 ? ' nm-gold' : p.rank === 2 ? ' nm-silver' : ''}" href="#player-${attr(activeScorersCode)}-${attr(p.id)}" data-pid="${attr(p.id)}" data-lg="${attr(activeScorersCode)}" data-tid="${attr(p.teamId || '')}" data-name="${attr(p.name)}" data-logo="${attr(p.teamLogo || '')}" data-en="${attr(p.nameEn || '')}">${esc(p.name)}</a>`
        : `<span${p.rank === 1 ? ' class="nm-gold"' : p.rank === 2 ? ' class="nm-silver"' : ''} data-en="${attr(p.nameEn || '')}">${esc(p.name)}</span>`;
    // 所属クラブのマークは名前のすぐ左に表示（以前は別の列にあり、スマホでは列ごと非表示で見えなかった）
    // 順位に応じて行の枠ごと大きく（rk1＞rk2＞rk3＞それ以外）
    return `<tr${p.rank <= 3 ? ` class="rk${p.rank}"` : ''}>
      <td class="stnd-rank" style="${rankStyle(p.rank)}">${p.rank}</td>
      <td style="${nameStyle(p.rank)};padding:8px 10px"><span class="scorer-name-inner">${tl}${nameCell}</span></td>
      <td class="stnd-num hide-sm">${p.matches}</td>
      <td class="stat-val">${p.value}</td>
    </tr>`;
  }).join('');
  return `<table class="tbl stnd scorers">
    <thead><tr>
      <th class="c" style="width:28px"></th>
      <th class="l">${T.player}</th>
      <th class="c hide-sm" style="width:36px">${T.pCol}</th>
      <th class="c" style="width:52px">${esc(colLabel)}</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ════════════════════════════════════════
   Wikipedia 日本語名検索
════════════════════════════════════════ */
// 後方互換ラッパー（管理者ページのW検索ボタンが使用）：日本語名の文字列 or null を返す
async function lookupWikipediaJa(name) { return (await lookupWikipediaJaEx(name)).ja; }

// 本体：{ ja: 見つかった日本語名 or null, reached: Wikipedia/Wikidataに一度でも到達できたか }
// reached は呼び出しごとのローカル変数なので、並列実行しても混ざらない
async function lookupWikipediaJaEx(name) {
  let reached = false;
  const done = ja => ({ ja, reached });
  const wpApi = 'https://en.wikipedia.org/w/api.php';
  const wdApi = 'https://www.wikidata.org/w/api.php';
  const llq   = '&prop=langlinks&lllang=ja&format=json&origin=*';

  // 発音符号を除去（š→s, ö→o, á→a 等）。さらに分解されない特殊文字も英字に寄せる
  // （ESPNは "Pascal Gross"、Wikipediaは "Pascal Groß" のように表記が違い、照合に失敗して
  //   「日本語名なし」と誤判定されていたため）
  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/ß/g, 'ss').replace(/ø/g, 'o').replace(/æ/g, 'ae').replace(/œ/g, 'oe')
      .replace(/đ/g, 'd').replace(/ð/g, 'd').replace(/ł/g, 'l').replace(/ı/g, 'i').replace(/þ/g, 'th');
  }
  const nameParts = norm(name).split(/\s+/).filter(w => w.length > 1);
  // 綴りの揺れ対策：ESPNとWikipediaで1〜2文字違う表記（Mykhaylo/Mykhailo、Mueller/Muller 等）を同一人物として照合する。
  // 名前の全パートが一致する必要があるので、別人を拾う危険は小さい。短い語(4文字以下)は完全一致のみ。
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 3;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }
  const tol = p => p.length >= 9 ? 2 : p.length >= 5 ? 1 : 0;
  function matches(title) {
    const t = norm(title);
    const words = t.split(/[^a-z0-9]+/).filter(Boolean);
    return nameParts.every(p => {
      if (t.includes(p)) return true;
      const k = tol(p);
      if (!k) return false;
      // ハイフン入りの名前("heung-min")は語に分けた側とも比べる
      return words.some(w => lev(p, w) <= k) || p.split('-').every(q => words.some(w => lev(q, w) <= tol(q)));
    });
  }

  function firstJa(pages) {
    for (const p of Object.values(pages || {})) {
      if (p.pageid > 0 && matches(p.title)) {
        const ja = p.langlinks?.find(l => l.lang === 'ja')?.['*'];
        if (ja) return ja;
      }
    }
    return null;
  }
  async function wpFetch(titles) {
    try {
      const r = await fetch(`${wpApi}?action=query&titles=${encodeURIComponent(titles)}${llq}`);
      if (r.ok) { reached = true; return firstJa((await r.json()).query?.pages); }
      return null;
    } catch { return null; }
  }
  async function wpSearch(q, n = 5) {
    try {
      const r = await fetch(`${wpApi}?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=${n}&srnamespace=0&format=json&origin=*`);
      if (r.ok) { reached = true; return ((await r.json()).query?.search || []).map(h => h.title).join('|'); }
      return '';
    } catch { return ''; }
  }

  // 試み①〜④: 英語Wikipedia → 日本語langlink
  const ja1 = await wpFetch(name);
  if (ja1) return done(ja1);

  const t2 = await wpSearch(name, 5);
  if (t2) { const ja2 = await wpFetch(t2); if (ja2) return done(ja2); }

  const t3 = await wpSearch(name + ' footballer', 3);
  if (t3) { const ja3 = await wpFetch(t3); if (ja3) return done(ja3); }

  const t4 = await wpSearch(name + ' football club', 3);
  if (t4) { const ja4 = await wpFetch(t4); if (ja4) return done(ja4); }

  // 試み⑤: Wikidata 日本語ラベル
  // 英語Wikipedia ↔ 日本語Wikipedia の対応がない選手でも
  // Wikidata には日本語ラベル（表記）が登録されていることが多い
  try {
    const r5 = await fetch(
      `${wdApi}?action=wbsearchentities&search=${encodeURIComponent(name)}&language=en&type=item&limit=5&format=json&origin=*`
    );
    if (r5.ok) {
      reached = true;
      const items = (await r5.json()).search || [];
      for (const item of items) {
        if (!matches(item.label || '')) continue;
        const r6 = await fetch(
          `${wdApi}?action=wbgetentities&ids=${encodeURIComponent(item.id)}&languages=ja&props=labels%7Csitelinks&sitefilter=jawiki&format=json&origin=*`
        );
        if (!r6.ok) continue;
        const ent = (await r6.json()).entities?.[item.id];
        const jaTitle = ent?.sitelinks?.jawiki?.title;
        if (jaTitle) return done(jaTitle);
        const jaLabel = ent?.labels?.ja?.value;
        if (jaLabel) return done(jaLabel);
      }
    }
  } catch {}

  return done(null);
}

(function() {
  const popup  = document.getElementById('adminPopup');
  const enDiv  = document.getElementById('adminPopupEn');
  const inp    = document.getElementById('adminPopupInput');
  const save   = document.getElementById('adminPopupSave');

  document.body.addEventListener('click', e => {
    if (!adminMode) return;
    const el = e.target.closest('.admin-name');
    if (!el) return;
    currentEn   = el.dataset.en;
    currentType = el.dataset.type || 'player';
    const jaBase = currentType === 'team'
      ? (TEAM_NAMES_JA[currentEn] || currentEn)
      : (PLAYER_NAMES_JA[currentEn] || currentEn);
    const override = currentType === 'team'
      ? nameOverrides.teams[currentEn]
      : nameOverrides.players[currentEn];
    document.getElementById('adminPopupLabel').textContent =
      currentType === 'team' ? 'クラブ名を編集' : '選手名を編集';
    enDiv.textContent = currentEn;
    inp.value = override || jaBase;
    popup.classList.add('open');
    inp.focus();
    inp.select();
  });

  function closePopup() { popup.classList.remove('open'); currentEn = ''; }

  save.addEventListener('click', () => {
    if (!currentEn) return;
    const val = inp.value.trim();
    if (!val) return;
    const jaBase = currentType === 'team'
      ? (TEAM_NAMES_JA[currentEn] || currentEn)
      : (PLAYER_NAMES_JA[currentEn] || currentEn);
    const map = currentType === 'team' ? nameOverrides.teams : nameOverrides.players;
    if (val !== jaBase) map[currentEn] = val;
    else delete map[currentEn];
    try { localStorage.setItem('nameOverrides', JSON.stringify(nameOverrides)); } catch {}
    closePopup();
    if (currentType === 'player') {
      // 選手キャッシュをクリアして再描画
      delete scorersCache[activeScorersCode];
      loadScorers(activeScorersCode, false);
    } else {
      // チーム名変更 → ノックアウト再描画
      Object.keys(koCache).forEach(k => delete koCache[k]);
      if (activePage === 'standings') loadStandings(activeStandCode, false);
    }
  });

  // Wikipedia検索ボタン
  const wikiBtn    = document.getElementById('adminWikiBtn');
  const wikiStatus = document.getElementById('adminWikiStatus');
  wikiBtn.addEventListener('click', async () => {
    if (!currentEn) return;
    wikiBtn.textContent = '検索中…';
    wikiBtn.style.opacity = '.5';
    wikiStatus.textContent = '';
    const ja = await lookupWikipediaJa(currentEn);
    wikiBtn.textContent = 'W検索';
    wikiBtn.style.opacity = '';
    if (ja) {
      inp.value = ja;
      wikiStatus.textContent = '✓ Wikipedia: ' + ja;
      wikiStatus.style.color = '#10b981';
    } else {
      wikiStatus.textContent = '見つかりませんでした';
      wikiStatus.style.color = '#ef4444';
    }
  });

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') closePopup(); });
  cancel.addEventListener('click', closePopup);
  popup.addEventListener('click', e => { if (e.target === popup) closePopup(); });
})();

let editPageInited = false;

function initEditPage() {
  if (editPageInited) return;
  editPageInited = true;

  function buildRows(map, overrides) {
    let html = '';
    for (const [en, jaBase] of Object.entries(map)) {
      const ja      = overrides[en] ?? jaBase;
      const changed = overrides[en] ? ' changed' : '';
      html += `<tr data-en="${attr(en)}" data-base="${attr(jaBase)}">` +
              `<td>${esc(en)}</td>` +
              `<td style="display:flex;gap:4px;align-items:center">` +
              `<input class="edit-inp${changed}" type="text" value="${attr(ja)}" style="flex:1">` +
              `<button class="wiki-btn" data-en="${attr(en)}" title="Wikipediaで日本語名を検索">W</button>` +
              `</td>` +
              `</tr>`;
    }
    return html;
  }

  document.getElementById('teamEditBody').innerHTML   = buildRows(TEAM_NAMES_JA,   nameOverrides.teams);
  document.getElementById('playerEditBody').innerHTML = buildRows(PLAYER_NAMES_JA, nameOverrides.players);
  document.getElementById('teamEditCnt').textContent   = Object.keys(TEAM_NAMES_JA).length   + '件';
  document.getElementById('playerEditCnt').textContent = Object.keys(PLAYER_NAMES_JA).length + '件';

  // 変更ハイライト
  document.querySelectorAll('#teamEditBody input, #playerEditBody input').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.classList.toggle('changed', inp.value !== inp.closest('tr').dataset.base);
    });
  });

  // 行ごとのWikipedia検索ボタン
  document.querySelectorAll('#teamEditBody .wiki-btn, #playerEditBody .wiki-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const en  = btn.dataset.en;
      const inp = btn.closest('tr').querySelector('input');
      btn.textContent = '…';
      btn.classList.add('loading');
      const ja = await lookupWikipediaJa(en);
      btn.textContent = 'W';
      btn.classList.remove('loading');
      if (ja) {
        inp.value = ja;
        inp.classList.toggle('changed', ja !== btn.closest('tr').dataset.base);
        inp.style.borderColor = '#10b981';
        setTimeout(() => { inp.style.borderColor = ''; }, 1500);
      } else {
        btn.title = '見つかりませんでした';
        btn.style.color = '#ef4444';
        setTimeout(() => { btn.style.color = ''; btn.title = 'Wikipediaで日本語名を検索'; }, 2000);
      }
    });
  });

  // 検索フィルター
  function bindSearch(searchId, tbodyId) {
    document.getElementById(searchId).addEventListener('input', function() {
      const q = this.value.toLowerCase();
      document.querySelectorAll(`#${tbodyId} tr`).forEach(tr => {
        tr.style.display = (!q
          || tr.dataset.en.toLowerCase().includes(q)
          || tr.querySelector('input').value.toLowerCase().includes(q))
          ? '' : 'none';
      });
    });
  }
  bindSearch('teamSearch',   'teamEditBody');
  bindSearch('playerSearch', 'playerEditBody');

  // 保存
  document.getElementById('editSaveBtn').addEventListener('click', () => {
    const teams = {}, players = {};
    document.querySelectorAll('#teamEditBody tr').forEach(tr => {
      const val = tr.querySelector('input').value.trim();
      if (val && val !== tr.dataset.base) teams[tr.dataset.en] = val;
    });
    document.querySelectorAll('#playerEditBody tr').forEach(tr => {
      const val = tr.querySelector('input').value.trim();
      if (val && val !== tr.dataset.base) players[tr.dataset.en] = val;
    });
    nameOverrides = { teams, players };
    try { localStorage.setItem('nameOverrides', JSON.stringify(nameOverrides)); } catch {}
    const total = Object.keys(teams).length + Object.keys(players).length;
    const msg = document.getElementById('editSaved');
    msg.textContent = T.saved + total + T.savedSuffix;
    setTimeout(() => { msg.textContent = ''; }, 3000);
  });
}

/* ════════════════════════════════════════
   選手ページ（得点ランキングで選手名をタップすると開く）
   構成はスポーツナビの選手名鑑のまま（ユーザー指示 2026-10-22）：
     上部（名前・背番号・ポジション・写真の代わりにクラブのマーク）→ 直近の試合と出場状況 → プロフィール
     → シーズン成績（個人成績 3列×3段）→ 大会の成績（日付・出場時間[S=先発/▲=途中]・得点・PK・アシスト・警告/退場）
   速さ：タップした瞬間に名前とクラブのマークで上部を出し、端末保存があれば全体を即表示。
         取得は全部並行（プロフィール・今季成績・試合一覧・チーム日程×2・試合ごとの個人成績）。各0.2秒前後
   iPhoneの「戻る」(左端スワイプ)で得点ランキングに戻れるよう、URLの #player-大会-選手ID を履歴に積む
════════════════════════════════════════ */
const POS_ABBR = { Goalkeeper: 'GK', Defender: 'DF', Midfielder: 'MF', Forward: 'FW' };
const PL_STORE_KEY = 'playerStoreV4';   // V3: 個人成績・試合ごとの表をスポーツナビ再現版の作りに戻した / V4: 平均との比較用の数字を追加(10/22)
const PL_STORE_MAX_AGE = 24 * 60 * 60 * 1000;
const playerMem = {};
let playerReturnY = 0;
let playerSeq = 0;   // 別の選手を開き直した時に、前の選手の遅れて届いたデータで上書きしないため

// 選手ページの「大会別の成績」に出てくる、日程表に無い大会の日本語名
const COMP_JA = {
  'fifa.world': 'ワールドカップ', 'fifa.worldq.uefa': 'W杯欧州予選', 'fifa.cwc': 'クラブワールドカップ',
  'uefa.super_cup': 'UEFAスーパーカップ', 'uefa.euro': 'EURO', 'conmebol.america': 'コパ・アメリカ', 'afc.asian.cup': 'アジアカップ',
  'eng.charity': 'コミュニティ・シールド', 'esp.joan_gamper': 'ジョアン・ガンペール杯', 'eng.fa': 'FAカップ', 'eng.league_cup': 'カラバオカップ',
  'esp.super_cup': 'スーペルコパ', 'ita.super_cup': 'スーペルコッパ', 'ger.super_cup': 'DFLスーパーカップ', 'fra.super_cup': 'トロフェ・デ・シャンピオン',
};
function compLabel(slug, fallback) {
  if (LANG === 'ja' && COMP_JA[slug]) return COMP_JA[slug];
  const lg = [...SCHEDULE_LEAGUES, ...SCORERS_LEAGUES].find(l => l.code === slug);
  if (lg) return slug === 'uefa.champions' ? (LANG === 'ja' ? 'チャンピオンズリーグ' : 'Champions League')
               : slug === 'uefa.europa'    ? (LANG === 'ja' ? 'ヨーロッパリーグ' : 'Europa League')
               : lg.label.replace(/^🌍\s*/, '');
  return String(fallback || slug).replace(/^\d{4}(-\d{2})?\s+/, '');   // 「2026-27 」などの年を外す
}

function readPlayerStore() { try { return JSON.parse(localStorage.getItem(PL_STORE_KEY) || '{}') || {}; } catch { return {}; } }
function savePlayerStore(key, v) {
  try {
    const st = readPlayerStore();
    st[key] = { ...v, savedAt: Date.now() };
    const keys = Object.keys(st).sort((a, b) => (st[b].savedAt || 0) - (st[a].savedAt || 0));
    keys.slice(40).forEach(k => delete st[k]);   // 保存は最近見た40人まで
    localStorage.setItem(PL_STORE_KEY, JSON.stringify(st));
  } catch {}
}

const plNum = (m, k) => (m && m[k] != null ? Math.round(m[k]) : null);
function statMapOf(js) {
  const m = {};
  for (const c of js?.splits?.categories || []) for (const x of c.stats || []) if (!(x.name in m)) m[x.name] = x.value;
  return m;
}
function plDateTime(iso) {
  const d = new Date(iso);
  const o = { timeZone: LANG === 'ja' ? 'Asia/Tokyo' : undefined };
  const md = d.toLocaleDateString('en-US', { ...o, month: 'numeric', day: 'numeric' });
  const hm = d.toLocaleTimeString('en-GB', { ...o, hour: '2-digit', minute: '2-digit', hour12: false });
  return { md, hm, day: d.toLocaleDateString('sv-SE', o) };
}

// ESPNの取得 → 表示用の小さなデータにまとめる（端末保存もこの形）。届いたものから順に onPart で知らせる
const ESPN_COMMON = 'https://site.web.api.espn.com/apis/common/v3/sports/soccer';
const scoreOf = c => { const v = c?.score; return v == null ? null : (typeof v === 'object' ? (v.displayValue ?? v.value) : v); };
function fetchPlayerParts(id, lg, tidHint, onPart) {
  const season = currentSeason();
  const j = (u, fresh = true) => fetchJson(u, { retries: 1, fresh }).catch(() => null);
  const athP = j(`${ESPN_CORE}/${lg}/seasons/${season}/athletes/${id}`, false);
  const statP = j(`${ESPN_CORE}/${lg}/seasons/${season}/types/1/athletes/${id}/statistics`);
  const logP = j(`${ESPN_CORE}/${lg}/seasons/${season}/athletes/${id}/eventlog?limit=100`);
  const tidP = tidHint ? Promise.resolve(String(tidHint)) : athP.then(a => extractId(a?.team?.$ref, 'teams'));
  const schedP = tidP.then(tid => tid
    ? Promise.all([j(`${ESPN_SCHED}/${lg}/teams/${tid}/schedule`), j(`${ESPN_SCHED}/${lg}/teams/${tid}/schedule?fixture=true`, false)])
    : [null, null]);

  const pProf = athP.then(a => {
    if (!a) return null;
    const pos = a.position?.name || a.position?.displayName || '';
    const prof = {
      nameEn: a.displayName || a.fullName || '', jersey: a.jersey || '', pos: POS_ABBR[pos] || a.position?.abbreviation || '',
      nat: a.citizenship || '', dob: a.dateOfBirth ? a.dateOfBirth.slice(0, 10) : '', age: a.age ?? null,
      height: a.height ? Math.round(a.height * 2.54) : null, weight: a.weight ? Math.round(a.weight * 0.4536) : null,
      tid: extractId(a.team?.$ref, 'teams'),
    };
    onPart({ prof });
    return prof;
  });
  const pSeason = statP.then(js => {
    const m = statMapOf(js);
    const season = js ? {
      goals: plNum(m, 'totalGoals'), pk: plNum(m, 'penaltyKickGoals'), assists: plNum(m, 'goalAssists'),
      shots: plNum(m, 'totalShots'), sot: plNum(m, 'shotsOnTarget'), yc: plNum(m, 'yellowCards'), rc: plNum(m, 'redCards'),
      apps: plNum(m, 'appearances'), starts: plNum(m, 'starts'), subIns: plNum(m, 'subIns'), minutes: plNum(m, 'minutes'),
      // 同じポジションの平均との比較(横棒)に使う元の数字
      raw: Object.fromEntries(['minutes', 'totalGoals', 'goalAssists', 'totalShots', 'shotsOnTarget', 'shotAssists', 'totalPasses', 'accuratePasses',
        'totalTackles', 'effectiveTackles', 'interceptions', 'totalClearance', 'recoveries', 'duelsWon', 'duels', 'saves', 'goalsConceded'].map(k => [k, +m[k] || 0])),
    } : null;
    onPart({ season });
    return season;
  });
  // 試合ごと：選手の試合一覧(eventlog)で出場した試合の個人成績を並行で取り、チーム日程(日付・対戦相手・結果)と合わせる
  const pPer = logP.then(log => Promise.all((log?.events?.items || []).filter(it => it.played && it.statistics?.$ref).map(async it => {
    const eid = it.event?.$ref?.match(/events\/(\d+)/)?.[1];
    const m = statMapOf(await j(it.statistics.$ref.replace(/^http:/, 'https:'), false));   // 終わった試合の成績は変わらないので保存分でよい
    return [eid, {
      min: plNum(m, 'minutes'), start: m.starts > 0, sub: m.subIns > 0,
      g: plNum(m, 'totalGoals'), pk: plNum(m, 'penaltyKickGoals'), a: plNum(m, 'goalAssists'),
      yc: plNum(m, 'yellowCards'), rc: plNum(m, 'redCards'),
    }];
  }))).then(Object.fromEntries);
  const pRows = Promise.all([schedP, pPer, tidP]).then(([[past, fut], per, tid]) => {
    const evs = [...(past?.events || []), ...(fut?.events || [])];
    const seen = new Set();
    const rows = evs.filter(e => e?.id && !seen.has(e.id) && seen.add(e.id)).map(e => {
      const c = e.competitions?.[0] || {};
      const done = c.status?.type?.completed === true || e.status?.type?.completed === true;
      const comp = c.competitors || [];
      const own = comp.find(x => String(x.team?.id) === String(tid)) || comp[0] || {};
      const opp = comp.find(x => x !== own) || {};
      return {
        eid: String(e.id), date: e.date, done, home: own.homeAway === 'home',
        oppId: opp.team?.id || '', opp: opp.team?.displayName || '',
        os: done ? scoreOf(own) : null, ps: done ? scoreOf(opp) : null,
        p: per[e.id] || null,
      };
    }).sort((a, b) => new Date(a.date) - new Date(b.date));
    onPart({ rows });
    return rows;
  });
  return Promise.all([pProf, pSeason, pRows]).then(([prof, season, rows]) => ({ prof, season, rows }));
}

/* ── 同じポジションの平均との比較（横棒） ──
   平均は GitHub Actions が毎晩計算して data/position-averages.json に置く（tools/position_averages.py）。
   リポジトリのファイルを直接読む（GitHub Pages の公開処理を待たずに最新が使える）。手元の確認用サーバーでは手元のファイル */
const POSAVG_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? 'data/position-averages.json'
  : 'https://raw.githubusercontent.com/football-data-rank/football-schedule/main/data/position-averages.json';
let _posAvgP = null;
function loadPosAvg() {
  if (!_posAvgP) _posAvgP = fetchJson(POSAVG_URL, { retries: 1, fresh: false }).catch(() => { _posAvgP = null; return null; });
  return _posAvgP;
}
// 比べる軸（ポジションごと）。[日本語, 英語, 種類, 分子, 分母, 少ない方が良いか, 個人の割合を出す最低の分母]
const CMP_META = {
  goals90:     ['得点', 'Goals', 'per90', 'totalGoals'],
  assists90:   ['アシスト', 'Assists', 'per90', 'goalAssists'],
  shots90:     ['シュート', 'Shots', 'per90', 'totalShots'],
  keyPasses90: ['キーパス', 'Key passes', 'per90', 'shotAssists'],
  passes90:    ['パス数', 'Passes', 'per90', 'totalPasses'],
  tackles90:   ['タックル', 'Tackles', 'per90', 'totalTackles'],
  intercept90: ['インターセプト', 'Interceptions', 'per90', 'interceptions'],
  clear90:     ['クリア', 'Clearances', 'per90', 'totalClearance'],
  recov90:     ['ボール回収', 'Recoveries', 'per90', 'recoveries'],
  saves90:     ['セーブ', 'Saves', 'per90', 'saves'],
  conceded90:  ['失点', 'Goals conceded', 'per90', 'goalsConceded', null, true],
  shotOnPct:   ['枠内シュート率', 'Shot accuracy', 'rate', 'shotsOnTarget', 'totalShots', false, 5],
  convPct:     ['決定率', 'Conversion', 'rate', 'totalGoals', 'totalShots', false, 5],
  passPct:     ['パス成功率', 'Pass accuracy', 'rate', 'accuratePasses', 'totalPasses', false, 50],
  tacklePct:   ['タックル成功率', 'Tackle success', 'rate', 'effectiveTackles', 'totalTackles', false, 5],
  duelPct:     ['デュエル勝率', 'Duels won', 'rate', 'duelsWon', 'duels', false, 10],
  savePct:     ['セーブ率', 'Save rate', 'rate', 'saves', ['saves', 'goalsConceded'], false, 10],
};
const CMP_AXES = {
  FW: ['goals90', 'shots90', 'shotOnPct', 'convPct', 'assists90', 'passPct'],
  MF: ['assists90', 'keyPasses90', 'passPct', 'passes90', 'tacklePct', 'intercept90', 'duelPct'],
  DF: ['tacklePct', 'tackles90', 'intercept90', 'clear90', 'recov90', 'duelPct', 'passPct'],
  GK: ['savePct', 'saves90', 'conceded90', 'passPct'],
};
const CMP_POS_JA = { FW: 'フォワード', MF: 'ミッドフィルダー', DF: 'ディフェンダー', GK: 'ゴールキーパー' };
function cmpHtml(st) {
  const ja = LANG === 'ja';
  const pos = st.prof?.pos, raw = st.season?.raw;
  const grp = st.posAvg?.leagues?.[st.lg]?.[pos];
  // 出場が90分未満だと数字が極端になる（例：セーブ0.00）ので比較の欄は出さない
  if (!pos || !raw || !grp || !CMP_AXES[pos] || !(raw.minutes >= 90)) return '';
  const fmt = (v, kind) => (kind === 'rate' ? `${Math.round(v)}%` : v.toFixed(2));
  const rows = CMP_AXES[pos].map(key => {
    const [jl, el, kind, num, den, lower, minDen] = CMP_META[key];
    const a = grp.m?.[key];
    if (!a) return '';
    let v;
    if (kind === 'per90') v = raw[num] / raw.minutes * 90;
    else {
      const d = Array.isArray(den) ? den.reduce((x, k) => x + (raw[k] || 0), 0) : raw[den];
      if (!(d >= minDen)) return '';   // 回数が少なすぎる割合は出さない（ぶれるため）
      v = raw[num] / d * 100;
    }
    const top = Math.max(a.p90 * 1.15, a.avg * 1.6, v * 1.05, 0.0001);
    const good = lower ? v <= a.avg : v >= a.avg;
    return `<div class="cmp-row">
        <div class="cmp-top"><span class="cmp-lbl">${ja ? jl : el}</span><span class="cmp-val">${fmt(v, kind)}<small>${ja ? '平均' : 'avg'} ${fmt(a.avg, kind)}</small></span></div>
        <div class="cmp-track"><div class="cmp-fill${good ? '' : ' low'}" style="width:${Math.min(100, v / top * 100).toFixed(1)}%"></div><div class="cmp-avg" style="left:${Math.min(100, a.avg / top * 100).toFixed(1)}%"></div></div>
      </div>`;
  }).join('');
  if (!rows) return '';
  const lgName = compLabel(st.lg);
  const few = raw.minutes < (st.posAvg.minMinutes || 270);
  const upd = st.posAvg.updated ? plDateTime(st.posAvg.updated).md : '';
  return `<h4 class="pl-sub-h">${ja ? '同じポジションの平均と比べる' : 'Compared with the average player'}</h4>
    <div class="cmp-note">${ja
      ? `${esc(lgName)}の${CMP_POS_JA[pos]}（出場${grp.n}人）の平均と比較。％以外は90分あたりの数字です。${upd ? `（${esc(upd)}更新）` : ''}`
      : `Average of ${grp.n} ${esc(lgName)} players in the same position. Per 90 minutes except %.`}</div>
    ${few ? `<div class="cmp-note cmp-warn">${ja ? `出場時間が短い（${raw.minutes}分）ため、参考の数字です。` : `Only ${raw.minutes} minutes played — treat as indicative.`}</div>` : ''}
    <div class="cmp-legend"><span><i class="cmp-key"></i>${ja ? 'この選手' : 'This player'}</span><span><i class="cmp-key avg"></i>${ja ? '平均' : 'Average'}</span></div>
    ${rows}`;
}

function renderPlayerPage(st) {
  const ja = LANG === 'ja';
  const wrap = document.getElementById('playerWrap');
  const back = `<button class="pl-back" id="playerBackBtn">← ${ja ? '得点ランキング' : 'Top Scorers'}</button>`;
  const wait = `<div class="pl-wait">${T.loading}</div>`;

  const tid = prof?.tid || st.tid;
  const logo = tid ? `https://a.espncdn.com/i/teamlogos/soccer/500/${tid}.png` : (st.logo || '');
  // 見出し：日本語表示は小さな英字(PROFILE など)＋日本語、英語表示は英字だけ
  const head = (ov, jaTitle) => ja ? `<span class="pl-ov">${ov}</span><h3 class="pl-sec-h">${jaTitle}</h3>` : `<h3 class="pl-sec-h">${ov.charAt(0) + ov.slice(1).toLowerCase()}</h3>`;

  // ① 上部（名前・背番号・ポジション・クラブのマーク。背番号を大きく透かしで敷く）
