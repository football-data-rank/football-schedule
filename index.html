      <div class="pl-hero-main">
        <div class="pl-hero-name" id="plNameJa">${esc(name)}</div>
        <div class="pl-hero-num">${prof?.jersey ? `<b>${esc(prof.jersey)}</b>` : ''}${prof?.pos ? `<span>${esc(prof.pos)}</span>` : ''}</div>
      </div>
      <div class="pl-hero-img">${logo ? `<img src="${attr(logo)}" alt="" onerror="this.style.display='none'">` : ''}</div>
    </div>`;

  // ② プロフィール
  let profHtml = wait;
  if (prof) {
    const nat = prof.nat ? (ja ? (NATIONAL_TEAMS_JA[prof.nat] || teamNameJa(prof.nat)) : prof.nat) : '-';
    let dob = '-';
    if (prof.dob) {
      const [y, mo, da] = prof.dob.split('-').map(Number);
      dob = ja ? `${y}年${mo}月${da}日` : new Date(Date.UTC(y, mo - 1, da)).toLocaleDateString('en-US', { timeZone: 'UTC', year: 'numeric', month: 'short', day: 'numeric' });
      if (prof.age != null) dob += ja ? `（${prof.age}歳）` : ` (${prof.age})`;
    }
    const hw = `${prof.height ? prof.height + 'cm' : '-'} / ${prof.weight ? prof.weight + 'kg' : '-'}`;
    profHtml = `<div class="pl-prof">
        <div class="pl-prof-row"><span>${ja ? '国籍' : 'Nationality'}</span><b>${esc(nat)}</b></div>
        <div class="pl-prof-row"><span>${ja ? '生年月日（満年齢）' : 'Born (age)'}</span><b>${esc(dob)}</b></div>
        <div class="pl-prof-row"><span>${ja ? '身長／体重' : 'Height / Weight'}</span><b>${esc(hw)}</b></div>
      </div>`;
  } else if (st.done) profHtml = `<div class="pl-err">${T.failed}</div>`;

  // ③ 個人成績：スポーツナビ再現版の作り（灰色の項目欄＋数字の3列×3段の表）
  let seasonHtml = wait;
  const sv = st.season;
  if (sv) {
    const f = v => (v == null ? '-' : String(v));
    const conv = sv.goals != null && sv.shots ? String(Math.round(sv.goals / sv.shots * 100)) : '-';
    const p90 = sv.goals != null && sv.minutes ? (sv.goals / sv.minutes * 90).toFixed(3) : '-';
    const grid = [
      [[ja ? '得点' : 'Goals', f(sv.goals)], ['PK', f(sv.pk)], [ja ? 'アシスト' : 'Assists', f(sv.assists)]],
      [[ja ? 'シュート' : 'Shots', f(sv.shots)], [ja ? '警告/退場' : 'YC/RC', `${f(sv.yc)}/${f(sv.rc)}`], [ja ? '試合数' : 'Apps', f(sv.apps)]],
      [[ja ? '出場時間' : 'Minutes', f(sv.minutes)], [ja ? 'シュート決定率' : 'Conversion %', conv], [ja ? '90分平均得点' : 'Goals/90', p90]],
    ];
    seasonHtml = `<table class="sn-grid"><tbody>${grid.map(r =>
      `<tr>${r.map(c => `<th>${c[0]}</th>`).join('')}</tr><tr>${r.map(c => `<td>${esc(c[1])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  } else if (st.done) seasonHtml = `<div class="pl-err">${ja ? '今季の成績はまだありません' : 'No stats this season'}</div>`;

  // ④ 大会の成績（試合ごと）：スポーツナビ再現版の作り（青い日付・緑の四角いS=先発・▲=途中出場）
  let logHtml = wait;
  if (st.rows) {
    const rows = st.rows.map(r => {
      const { md } = plDateTime(r.date);
      const p = r.p;
      let min, g, pk, a, cd;
      if (p) {
        const mark = p.start ? '<span class="sn-s">S</span>' : p.sub ? '<span class="sn-in">▲</span>' : '';
        min = `${mark}${p.min ?? '-'}${ja ? '分' : "'"}`;
        g = p.g ?? 0; pk = p.pk ?? 0; a = p.a ?? 0; cd = `${p.yc ?? 0}/${p.rc ?? 0}`;
      } else if (r.done) { min = '-'; g = pk = a = '-'; cd = '-/-'; }
      else { min = g = pk = a = cd = ''; }
      const hit = v => (+v > 0 ? ' class="sn-hit"' : '');
      const rc = p ? '' : r.done ? ' class="sn-dnp"' : ' class="sn-future"';
      const cardCls = p && ((p.yc ?? 0) + (p.rc ?? 0)) > 0 ? ' class="sn-card"' : '';
      return `<tr${rc}><td class="sn-date">${esc(md)}</td><td class="sn-min">${min}</td><td${hit(g)}>${g}</td><td${hit(pk)}>${pk}</td><td${hit(a)}>${a}</td><td${cardCls}>${cd}</td></tr>`;
    }).join('');
    logHtml = rows
      ? `<table class="sn-log"><thead><tr><th>${ja ? '日付' : 'Date'}</th><th>${ja ? '出場時間' : 'Min'}</th><th>${ja ? '得点' : 'G'}</th><th>PK</th><th>${ja ? 'アシスト' : 'A'}</th><th>${ja ? '警告/退場' : 'YC/RC'}</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="pl-err">${ja ? '試合データがありません' : 'No matches'}</div>`;
  }
  const lgName = compLabel(st.lg);

  // データが届くたびにページ全体を作り直すと、名前・クラブのマーク・プロフィールがちらついて見えたので、
  // 中身が変わった部分だけを差し替える（見た目は変えない）
  const key = `${st.lg}:${st.id}`;
  if (wrap.dataset.pk !== key || !document.getElementById('plHero')) {
    wrap.innerHTML = `${back}<div id="plHero"></div><div id="plProf"></div><div id="plSeason"></div>`;
    wrap.dataset.pk = key;
  }
  const put = (id, html) => { const el = document.getElementById(id); if (el && el._h !== html) { el.innerHTML = html; el._h = html; } };
  put('plHero', hero);
  put('plProf', `<div class="pl-sec">${head('PROFILE', 'プロフィール')}${profHtml}</div>`);
  put('plSeason', `<div class="pl-sec">${head('SEASON STATS', 'シーズン成績')}
      <h4 class="pl-sub-h">${ja ? '個人成績' : 'Player stats'}</h4>${seasonHtml}
      ${cmpHtml(st)}
      <h4 class="pl-sub-h">${esc(lgName)}${ja ? 'の成績' : ''}</h4>${logHtml}
    </div>`);
}

// 選手ページの文字(M PLUS 1p)を先に読み込んでおく。日本語の文字は必要な分だけ後から届くため、
// 開いた直後は仮の文字で表示され、届いた瞬間に書体が切り替わって見えていた
const PL_FONT_TXT = 'ァアィイゥウェエォオカガキギクグケゲコゴサザシジスズセゼソゾタダチヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモャヤュユョヨラリルレロヮワヲンヴー・＝0123456789国籍生年月日満齢身長体重歳個人成績得点アシスト試合数出場時間警告退場決定率平均分';
function preloadPlayerFonts(extra = '') {
  if (!document.fonts?.load) return Promise.resolve();
  const txt = PL_FONT_TXT + extra;
  return Promise.all(['400', '700', '800'].map(w => document.fonts.load(`${w} 16px "M PLUS 1p"`, txt).catch(() => {})));
}

async function openPlayerPage(id, lg, push = true, hint = {}) {
  if (activePage !== 'player') playerReturnY = window.scrollY;
  if (push) history.pushState({ player: { id, lg, tid: hint.tid || '' } }, '', `#player-${lg}-${id}`);
  showPage('player');
  window.scrollTo(0, 0);
  const seq = ++playerSeq;
  const key = lg + ':' + id;
  // 端末保存があれば全体を即表示（裏で最新に差し替え）。無ければ名前とクラブのマークだけ先に出す
  const saved = playerMem[key] || (() => { const v = readPlayerStore()[key]; return v && Date.now() - v.savedAt < PL_STORE_MAX_AGE ? v : null; })();
  const st = { lg, id, name: hint.name || '', logo: hint.logo || '', tid: hint.tid || '', ...(saved || {}) };
  // 別の選手の中身が一瞬見えないよう、違う選手なら先に空にする
  const pw = document.getElementById('playerWrap');
  if (pw.dataset.pk !== key) { pw.innerHTML = ''; pw.dataset.pk = ''; }
  // 文字(書体)が届くのを少しだけ待ってから出す（最大0.35秒。先読み済みなら待たない）。データの取得は同時に始める
  let ready = false;
  loadPosAvg().then(a => {
    if (seq !== playerSeq || !a) return;
    st.posAvg = a;
    if (ready && activePage === 'player') renderPlayerPage(st);
  });
  const fontWait = Promise.race([preloadPlayerFonts(hint.name || ''), new Promise(r => setTimeout(r, 350))]).then(() => {
    if (seq !== playerSeq) return;
    ready = true;
    if (activePage === 'player') renderPlayerPage(st);
  });
  try {
    const full = await fetchPlayerParts(id, lg, hint.tid || saved?.prof?.tid, part => {
      if (seq !== playerSeq) return;
      Object.assign(st, part);
      if (ready && activePage === 'player') renderPlayerPage(st);
    });
    await fontWait;
    if (seq !== playerSeq) return;
    Object.assign(st, full, { done: true });
    if (activePage === 'player') renderPlayerPage(st);
    if (full.prof) { playerMem[key] = full; savePlayerStore(key, full); }
    // 日本語名が未登録なら、得点ランキングと同じくWikipediaで探して差し替える
    const nameEn = full.prof?.nameEn;
    if (LANG === 'ja' && nameEn && playerNameJa(nameEn) === nameEn && !nameOverrides.players[nameEn] && !PLAYER_NAMES_JA[nameEn] && !isMissFresh(nameEn)) {
      autoLookupPlayers([{ nameEn }], activeScorersCode).then(() => {
        const el = document.getElementById('plNameJa');
        if (el && seq === playerSeq && activePage === 'player') el.textContent = playerNameJa(nameEn);
      }).catch(() => {});
    }
  } catch {
    await fontWait;
    if (seq === playerSeq) { st.done = true; if (activePage === 'player') renderPlayerPage(st); }
  }
}
function closePlayerPage() {
  showPage('scorers');
  requestAnimationFrame(() => window.scrollTo(0, playerReturnY));
}
document.addEventListener('click', e => {
  const link = e.target.closest('.pl-link');
  if (link && activePage === 'scorers') {
    e.preventDefault();
    openPlayerPage(link.dataset.pid, link.dataset.lg, true, { tid: link.dataset.tid, name: link.dataset.name, logo: link.dataset.logo });
    return;
  }
  if (e.target.closest('#playerBackBtn')) {
    if (history.state?.player) history.back(); else closePlayerPage();
  }
});
window.addEventListener('popstate', ev => {
  const pl = ev.state?.player;
  if (pl) openPlayerPage(pl.id, pl.lg, false, { tid: pl.tid });
  else if (activePage === 'player') closePlayerPage();
});

/* ════════════════════════════════════════
   試合情報ページ（試合日程で試合の行をタップすると開く）
   データ：ESPN summary 1回（チーム成績・スタメン/フォーメーション・ベンチ・得点/アシスト/カード/交代の時間）。
   選手の採点と顔写真はESPNに無いので出さない。ライブ中は60秒ごとに更新。
   iPhoneの「戻る」で日程に戻れるよう、URLの #match-大会-試合ID を履歴に積む
════════════════════════════════════════ */
const matchMem = {};
let matchSeq = 0, matchTimer = null, matchReturnY = 0;
function txtOn(hex) {   // 背景色に読みやすい文字色（白か濃紺）
  const h = String(hex || '').replace('#', '');
  if (h.length < 6) return '#fff';
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 165 ? '#0f172a' : '#fff';
}
function mtShort(a) {   // ピッチ用の短い名前（日本語名があれば姓だけ、無ければ「M. Guéhi」形式）
  const en = a?.displayName || '';
  const ja = en ? playerNameJa(en) : '';
  if (ja && ja !== en) { const parts = ja.split(/[・＝]/); return parts.length > 1 ? parts[parts.length - 1] : ja; }
  return a?.shortName || en;
}
function mtFull(a) { const en = a?.displayName || ''; return en ? playerNameJa(en) : (a?.shortName || ''); }
// ポジション → 前後(0=GK … 5=FW)・左右(0=左サイド … 4=右サイド)
function posDepth(ab) {
  ab = String(ab || '').toUpperCase();
  if (ab === 'G' || ab === 'GK') return 0;
  if (/^(LWB|RWB|WB)/.test(ab)) return 1.5;
  if (/^(CD|CB|SW|LB|RB|D)/.test(ab)) return 1;
  if (/^(DM|CDM)/.test(ab)) return 2;
  if (/^(CM|LM|RM|M)/.test(ab)) return 3;
  if (/^(AM|CAM)/.test(ab)) return 4;
  if (/^(LW|RW|LF|RF|CF-|SS)/.test(ab)) return 4.8;
  if (/^(F|CF|ST|S)$/.test(ab)) return 5;
  return 3;
}
function posLat(ab) {
  ab = String(ab || '').toUpperCase();
  if (/-L$/.test(ab)) return 1;
  if (/-R$/.test(ab)) return 3;
  if (/^L/.test(ab)) return 0;
  if (/^R/.test(ab)) return 4;
  return 2;
}
// スタメン11人をフォーメーション(例 4-2-3-1)の列に分ける。[GKの列, DFの列, …, FWの列]
function lineupLines(roster, formation) {
  const st = (roster || []).filter(r => r.starter);
  if (!st.length) return [];
  const gk = st.find(r => posDepth(r.position?.abbreviation) === 0) || st.find(r => String(r.formationPlace) === '1');
  const field = st.filter(r => r !== gk).sort((a, b) => posDepth(a.position?.abbreviation) - posDepth(b.position?.abbreviation) || (+a.formationPlace || 0) - (+b.formationPlace || 0));
  const sizes = String(formation || '').split('-').map(Number).filter(n => n > 0);
  let lines = [];
  if (sizes.length && sizes.reduce((x, y) => x + y, 0) === field.length) {
    let k = 0;
    for (const n of sizes) { lines.push(field.slice(k, k + n)); k += n; }
  } else {   // フォーメーションが無い・人数が合わない時は、ポジションの前後でまとめる
    const by = {};
    field.forEach(r => { const d = Math.round(posDepth(r.position?.abbreviation)); (by[d] = by[d] || []).push(r); });
    lines = Object.keys(by).sort((a, b) => a - b).map(k => by[k]);
  }
  lines = lines.map(l => l.slice().sort((a, b) => posLat(a.position?.abbreviation) - posLat(b.position?.abbreviation) || (+a.formationPlace || 0) - (+b.formationPlace || 0)));
  return [gk ? [gk] : [], ...lines].filter(l => l.length);
}
// 試合の出来事（得点・アシスト・カード・交代）を選手ごとにまとめる
function matchEvents(d) {
  const by = {}, goals = [];
  const P = id => (by[id] = by[id] || { g: 0, og: 0, a: 0, yc: 0, rc: 0, inMin: '', outMin: '' });
  for (const k of d?.keyEvents || []) {
    const t = String(k.type?.type || '').toLowerCase();
    const ps = k.participants || [];
    const min = k.clock?.displayValue || '';
    const a0 = ps[0]?.athlete, a1 = ps[1]?.athlete;
    const isOG = t.includes('own-goal') || t.includes('own goal');
    const isGoal = isOG || t.startsWith('goal') || t === 'penalty---scored';
    if (isGoal && a0?.id) {
      if (isOG) P(a0.id).og++; else P(a0.id).g++;
      if (!isOG && a1?.id) P(a1.id).a++;
      goals.push({ team: String(k.team?.id || ''), a: a0, min, pk: t.startsWith('penalty'), og: isOG });
    } else if (t.includes('yellow-card') && a0?.id) {
      if (t.includes('second')) P(a0.id).rc++; else P(a0.id).yc++;
    } else if (t.includes('red-card') && a0?.id) {
      P(a0.id).rc++;
    } else if (t === 'substitution') {
      if (a0?.id) P(a0.id).inMin = min;
      if (a1?.id) P(a1.id).outMin = min;
    }
  }
  return { by, goals };
}
function mtIcons(e) {
  if (!e) return '';
  let h = '';
  if (e.outMin) h += `<span class="mt-ic out">↓${esc(e.outMin.replace(/'.*$/, ''))}</span>`;
  if (e.rc) h += `<span class="mt-ic card mt-rc"></span>`; else if (e.yc) h += `<span class="mt-ic card mt-yc"></span>`;
  if (e.g || e.og) h += `<span class="mt-ic g">${e.og ? 'OG' : '⚽'}${(e.g + e.og) > 1 ? '×' + (e.g + e.og) : ''}</span>`;
  if (e.a) h += `<span class="mt-ic a">👟${e.a > 1 ? '×' + e.a : ''}</span>`;
  return h;
}

function renderMatchPage(st) {
  const ja = LANG === 'ja';
  const wrap = document.getElementById('matchWrap');
  const back = `<button class="pl-back" id="matchBackBtn">← ${ja ? '試合日程' : 'Schedule'}</button>`;
  const d = st.d, m = st.m;
  const comp = d?.header?.competitions?.[0];
  const cs = comp?.competitors || [];
  const H = cs.find(c => c.homeAway === 'home'), A = cs.find(c => c.homeAway === 'away');
  const team = (c, name, logo) => ({ id: String(c?.team?.id || ''), name: teamNameJa(c?.team?.displayName || name || ''), logo: c?.team?.logos?.[0]?.href || c?.team?.logo || logo || '',
    color: normColor(c?.team?.color) || '#e2e8f0', score: c?.score ?? null });
  const h = team(H, m?.homeTeam, m?.homeLogo), a = team(A, m?.awayTeam, m?.awayLogo);
  if (!H && m) { h.name = m.homeTeam; a.name = m.awayTeam; h.score = m.homeScore; a.score = m.awayScore; }
  const status = comp?.status || null;
  const state = status?.type?.state || m?.state || 'pre';
  const when = plDateTime(comp?.date || m?.utcDate || new Date().toISOString());
  const lgLabel = compLabel(st.lg);

  // ① 上部：大会・日時、チーム、スコア、状態、得点者
  let stTxt;
  if (state === 'post') stTxt = ja ? '試合終了' : 'Full time';
  else if (state === 'in') stTxt = `LIVE ${status?.displayClock || m?.clock || ''}`.trim();
  else stTxt = ja ? `${when.md} ${when.hm} キックオフ` : `Kick-off ${when.md} ${when.hm}`;
  if (status?.type?.name && /POSTPONED|CANCELED|SUSPENDED/.test(status.type.name)) stTxt = ja ? '延期・中止' : status.type.description;
  const ev = d ? matchEvents(d) : { by: {}, goals: [] };
  const gl = side => ev.goals.filter(g => g.team === side.id).map(g => `${esc(mtShort(g.a))} ${esc(g.min)}${g.pk ? ' (PK)' : ''}${g.og ? ' (OG)' : ''}`).join('<br>');
  const showScore = state !== 'pre' && h.score != null && a.score != null;
  const hero = `<div class="mt-hero">
      <div class="mt-meta">${esc(lgLabel)} ・ ${esc(when.md)} ${esc(when.hm)}</div>
      <div class="mt-teams">
        <div class="mt-team">${h.logo ? `<img src="${attr(h.logo)}" alt="" onerror="this.style.display='none'">` : ''}<span>${esc(h.name)}</span></div>
        <div><div class="mt-score">${showScore ? `${esc(h.score)}<small>-</small>${esc(a.score)}` : '<small>vs</small>'}</div></div>
        <div class="mt-team">${a.logo ? `<img src="${attr(a.logo)}" alt="" onerror="this.style.display='none'">` : ''}<span>${esc(a.name)}</span></div>
      </div>
      <span class="mt-status${state === 'in' ? ' live' : ''}">${esc(stTxt)}</span>
      ${ev.goals.length ? `<div class="mt-goals"><div>${gl(h)}</div><div>${gl(a)}</div></div>` : ''}
    </div>`;

  if (!d) {
    wrap.innerHTML = `${back}${hero}<div class="mt-sec"><div class="mt-note">${st.err ? T.failed : T.loading}</div></div>`;
    return;
  }

  // ② チーム成績（良い方の数字にチームの色を付ける。ファウル・カード・オフサイドは少ない方が良い）
  const statOf = id => {
    const t = (d.boxscore?.teams || []).find(x => String(x.team?.id) === id);
    const mp = {};
    (t?.statistics || []).forEach(x => { mp[x.name] = x.displayValue; });
    return mp;
  };
  const sh = statOf(h.id), sa = statOf(a.id);
  const pct = (mp) => mp.totalPasses ? Math.round(+mp.accuratePasses / +mp.totalPasses * 100) : null;
  const STATS = [
    ['シュート', 'Shots', mp => mp.totalShots, 1], ['枠内シュート', 'On target', mp => mp.shotsOnTarget, 1],
    ['ボール支配率', 'Possession', mp => (mp.possessionPct != null ? Math.round(+mp.possessionPct) : null), 1, '%'],
    ['パス', 'Passes', mp => mp.totalPasses, 1], ['パス成功率', 'Pass accuracy', pct, 1, '%'],
    ['ファウル', 'Fouls', mp => mp.foulsCommitted, -1], ['イエローカード', 'Yellow cards', mp => mp.yellowCards, -1],
    ['レッドカード', 'Red cards', mp => mp.redCards, -1], ['オフサイド', 'Offsides', mp => mp.offsides, -1],
    ['コーナーキック', 'Corners', mp => mp.wonCorners, 1],
  ];
  let statsHtml = '';
  const rows = STATS.map(([jl, el, fn, dir, unit = '']) => {
    const x = fn(sh), y = fn(sa);
    if (x == null || y == null || x === '' || y === '') return '';
    const bx = (+x - +y) * dir > 0, by = (+y - +x) * dir > 0;
    const v = (val, best, c) => `<b class="mt-v${best ? ' best' : ''}" style="--tc:${c};--tt:${txtOn(c)}">${esc(val)}${unit}</b>`;
    return `<div class="mt-stat">${v(x, bx, h.color)}<span>${ja ? jl : el}</span>${v(y, by, a.color)}</div>`;
  }).join('');
  if (rows) statsHtml = `<div class="mt-sec"><span class="mt-ov">MATCH STATS</span><h3 class="mt-h">${ja ? 'チーム成績' : 'Team stats'}</h3>
      <div class="mt-stat-hd">${h.logo ? `<img src="${attr(h.logo)}" alt="">` : '<span></span>'}${a.logo ? `<img src="${attr(a.logo)}" alt="">` : '<span></span>'}</div>${rows}</div>`;

  // ③ スタメン（フォーメーション図）とベンチ
  const ro = side => (d.rosters || []).find(r => String(r.team?.id) === side.id) || (d.rosters || []).find(r => r.homeAway === (side === h ? 'home' : 'away'));
  const rh = ro(h), ra = ro(a);
  const lh = lineupLines(rh?.roster, rh?.formation), la = lineupLines(ra?.roster, ra?.formation);
  const plHtml = (r, side) => `<div class="mt-pl"><div class="mt-shirt" style="--sc:${side.color};--st:${txtOn(side.color)}">${esc(r.jersey || '')}${mtIcons(ev.by[r.athlete?.id])}</div>
      <div class="mt-nm">${esc(mtShort(r.athlete))}</div></div>`;
  let lineupHtml = '';
  if (lh.length && la.length) {
    // ホームは上（GKが一番上・相手ゴールに向かって下向き。左右は見る側から反転）、アウェーは下（GKが一番下）
    const top = lh.map(l => `<div class="mt-line">${l.slice().reverse().map(r => plHtml(r, h)).join('')}</div>`).join('');
    const bot = la.slice().reverse().map(l => `<div class="mt-line">${l.map(r => plHtml(r, a)).join('')}</div>`).join('');
    const bar = (side, r) => `<div class="mt-pteam">${side.logo ? `<img src="${attr(side.logo)}" alt="">` : ''}<span>${esc(side.name)}</span>${r?.formation ? `<span class="mt-form">${esc(r.formation)}</span>` : ''}</div>`;
    lineupHtml = `<div class="mt-sec"><span class="mt-ov">LINE-UPS</span><h3 class="mt-h">${ja ? 'スタメン' : 'Starting XI'}</h3>
        <div class="mt-pitch">${bar(h, rh)}<div class="mt-half top">${top}</div><div class="mt-half bot">${bot}</div>${bar(a, ra)}</div>`;
    const bench = r => (r?.roster || []).filter(x => !x.starter).sort((x, y) => (ev.by[y.athlete?.id]?.inMin ? 1 : 0) - (ev.by[x.athlete?.id]?.inMin ? 1 : 0));
    const bItem = x => {
      const e = ev.by[x.athlete?.id] || {};
      const evs = [
        e.inMin ? `<span class="mt-in">↑ ${esc(e.inMin)}</span>` : '',
        e.outMin ? `<span class="mt-outt">↓ ${esc(e.outMin)}</span>` : '',
        e.g ? `<span>⚽${e.g > 1 ? '×' + e.g : ''}</span>` : '', e.og ? '<span>OG</span>' : '',
        e.a ? `<span>👟${e.a > 1 ? '×' + e.a : ''}</span>` : '',
        e.rc ? '<span>🟥</span>' : e.yc ? '<span>🟨</span>' : '',
      ].join('');
      return `<div><div class="mt-bench-nm"><b>${esc(x.jersey || '')}</b>${esc(mtFull(x.athlete))}</div>${evs ? `<div class="mt-bench-ev">${evs}</div>` : ''}</div>`;
    };
    const bh = bench(rh), ba = bench(ra);
    if (bh.length || ba.length) lineupHtml += `<h4 class="pl-sub-h">${ja ? 'ベンチ' : 'Substitutes'}</h4>
        <div class="mt-bench"><div class="mt-bench-col">${bh.map(bItem).join('')}</div><div class="mt-bench-col">${ba.map(bItem).join('')}</div></div>`;
    lineupHtml += `<div class="mt-legend">
        <span><i>⚽</i>${ja ? 'ゴール' : 'Goal'}</span><span><i>👟</i>${ja ? 'アシスト' : 'Assist'}</span>
        <span><i>OG</i>${ja ? 'オウンゴール' : 'Own goal'}</span><span><i><span class="mt-ic card mt-yc" style="position:static;display:inline-block"></span></i>${ja ? 'イエローカード' : 'Yellow card'}</span>
        <span><i class="mt-in">↑</i>${ja ? '交代で入る' : 'Subbed on'}</span><span><i><span class="mt-ic card mt-rc" style="position:static;display:inline-block"></span></i>${ja ? 'レッドカード' : 'Red card'}</span>
        <span><i class="mt-outt">↓</i>${ja ? '交代で退く' : 'Subbed off'}</span>
      </div></div>`;
  } else {
    lineupHtml = `<div class="mt-sec"><span class="mt-ov">LINE-UPS</span><h3 class="mt-h">${ja ? 'スタメン' : 'Starting XI'}</h3>
        <div class="mt-note">${ja ? 'スタメンは試合開始のおよそ1時間前に発表されます。' : 'Line-ups are usually announced about an hour before kick-off.'}</div></div>`;
  }

  wrap.innerHTML = `${back}${hero}${statsHtml}${lineupHtml}`;
}

async function refreshMatch(id, lg, seq) {
  try {
    const d = await fetchJson(`${ESPN_SCHED}/${lg}/summary?event=${id}`, { retries: 1 });
    if (seq !== matchSeq) return;
    matchMem[id] = d;
    if (activePage === 'match') renderMatchPage({ id, lg, m: allMatches.find(x => String(x.id) === String(id)), d });
    const state = d.header?.competitions?.[0]?.status?.type?.state;
    const kick = new Date(d.header?.competitions?.[0]?.date || 0).getTime();
    // ライブ中・開始直前（スタメン発表待ち）は60秒ごとに更新
    if (state === 'in' || (state === 'pre' && kick - Date.now() < 90 * 60000)) {
      clearTimeout(matchTimer);
      matchTimer = setTimeout(() => { if (activePage === 'match' && seq === matchSeq) refreshMatch(id, lg, seq); }, 60000);
    }
  } catch {
    if (seq === matchSeq && !matchMem[id] && activePage === 'match') renderMatchPage({ id, lg, m: allMatches.find(x => String(x.id) === String(id)), d: null, err: true });
  }
}
function openMatchPage(id, lg, push = true) {
  const m = allMatches.find(x => String(x.id) === String(id));
  lg = lg || m?.lgCode;
  if (!lg) return;
  if (activePage !== 'match') matchReturnY = window.scrollY;
  if (push) history.pushState({ match: { id, lg } }, '', `#match-${lg}-${id}`);
  showPage('match');
  window.scrollTo(0, 0);
  const seq = ++matchSeq;
  clearTimeout(matchTimer);
  renderMatchPage({ id, lg, m, d: matchMem[id] || null });   // 日程のデータで上部をすぐ出し、詳細は届き次第
  refreshMatch(id, lg, seq);
}
function closeMatchPage() {
  showPage('schedule');
  requestAnimationFrame(() => window.scrollTo(0, matchReturnY));
}
document.addEventListener('click', e => {
  const row = e.target.closest('#schedulePage .tbl.sched tbody tr[data-mid]');
  if (row && activePage === 'schedule') { openMatchPage(row.dataset.mid, row.dataset.lg); return; }
  if (e.target.closest('#matchBackBtn')) {
    if (history.state?.match) history.back(); else closeMatchPage();
  }
});
window.addEventListener('popstate', ev => {
  const mt = ev.state?.match;
  if (mt) openMatchPage(mt.id, mt.lg, false);
  else if (activePage === 'match') closeMatchPage();
});

function showPage(page) {
  if (page === 'edit' && !adminMode) return;   // 管理者以外はアクセス不可
  activePage = page;
  document.getElementById('schedulePage').style.display  = page==='schedule'  ? '' : 'none';
  document.getElementById('standingsPage').style.display = page==='standings' ? '' : 'none';
  document.getElementById('scorersPage').style.display   = page==='scorers'   ? '' : 'none';
  document.getElementById('playerPage').style.display    = page==='player'    ? '' : 'none';
  document.getElementById('matchPage').style.display     = page==='match'     ? '' : 'none';
  if (page !== 'match') clearTimeout(matchTimer);   // 試合ページを離れたらライブの自動更新を止める
  document.getElementById('editPage').style.display      = page==='edit'      ? '' : 'none';
  const navPage = page === 'player' ? 'scorers' : page === 'match' ? 'schedule' : page;   // 選手ページ中は「得点ランキング」、試合ページ中は「試合日程」を選択中のままに
  document.querySelectorAll('.pnav').forEach(b => b.classList.toggle('active', b.dataset.page===navPage));
  if (page==='standings' && !standingsCache[activeStandCode])   loadStandings(activeStandCode);
  if (page==='scorers'   && !scorersCache[activeScorersCode])   loadScorers(activeScorersCode);
  if (page==='edit') initEditPage();
  if (page==='schedule') fitSchedNames();   // 非表示中に更新された分を測り直す
  if (page==='standings') pinStandingsCols();
}
document.querySelectorAll('.pnav').forEach(btn => { btn.onclick = () => showPage(btn.dataset.page); });

/* ════════════════════════════════════════
   ロード・自動更新（全ページ共通 3分）
════════════════════════════════════════ */
let loadInFlight = false;          // load()の多重実行防止
let lastLoadDone = Date.now();     // 最後にload()が完了した時刻（見張りタイマーの判定用）

async function load(showLoader = false) {
  if (loadInFlight) return;
  loadInFlight = true;
  const btn = document.getElementById('reloadBtn');
  btn.classList.add('spin');
  if (showLoader) document.getElementById('scheduleWrap').innerHTML = `<div class="state"><span class="ico">⚽</span>${T.loading}</div>`;
  try {
    allMatches = await fetchSchedule();
    buildCountryFilter();
    renderSchedule();
    markUpdated();
    saveSchedCache();   // 次に開いた時に即表示できるよう保存
    // 終わっているはずの時間なのに「ライブ」のままの試合は、試合単位のデータで照合して直す
    verifyStaleLive().then(ch => { if (!ch) return; renderSchedule(); saveSchedCache(); }).catch(() => {});
    // 先の日程は裏で取得し、取れたら表示に足す（初回表示を待たせない）
    fetchFarDays().then(got => {
      if (!got) return;
      allMatches = assembleMatches();
      buildCountryFilter();
      renderSchedule();
      saveSchedCache();
    }).catch(() => {});
  } catch(e) {
    document.getElementById('scheduleWrap').innerHTML = `<div class="state"><span class="ico">⚠️</span>${T.failed}: ${esc(e.message)}</div>`;
  } finally {
    btn.classList.remove('spin');
    loadInFlight = false;
    lastLoadDone = Date.now();
  }
  scheduleNextRefresh();
}

// 現在の状況に応じた更新間隔：ライブ中 or 試合時間帯（開始15分前〜3時間後）は60秒、それ以外は3分。
// 従来はESPNが state=in を返した時しか高速化されず、初回の応答が古いと最大3分間据え置かれていた
function refreshIntervalMs() {
  const hasLive = allMatches.some(m => m.state === 'in');
  const t = Date.now();
  const nearActive = allMatches.some(m => {
    if (!m.utcDate) return false;
    const mins = (t - new Date(m.utcDate).getTime()) / 60000;
    return mins >= -15 && mins <= 180;
  });
  return (hasLive || nearActive) ? REFRESH_LIVE : REFRESH_IDLE;
}

function scheduleNextRefresh() {
  clearTimeout(timer);
  timer = setTimeout(() => load(false), refreshIntervalMs());   // 次の予約はload()完了時に必ず行われる
}

function startAutoRefresh() {
  scheduleNextRefresh();
  // スマホはタブを閉じている間タイマーが停止する。復帰時に30秒以上経っていたら即更新
  //（「ライブなのに反映されない／終了済みなのに試合中のまま」の主因のひとつ）
  let lastWake = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastWake > 30_000) load(false);
    lastWake = Date.now();
  });
  // 見張りタイマー（自己修復）：何らかの理由で自動更新チェーンが死んでも、
  // 「予定間隔の2倍以上更新されていない」を検知して自動でload()を再起動する
  setInterval(() => {
    if (loadInFlight) return;
    if (Date.now() - lastLoadDone > refreshIntervalMs() * 2 + 15_000) load(false);
  }, 15_000);
}

/* ════════════════════════════════════════

/* 2回目以降の表示を速くする（sw.js：ページ本体を端末に保存して即表示、裏で最新版に更新）。
   新しい版が見つかった時は、開いた直後で、まだ触っていなければ1回だけ読み込み直して新しい版にする
   （アップロード直後に古い版が出たままにならないように）。触った後なら次に開いた時から新しい版。 */
(() => {
  if (!('serviceWorker' in navigator)) return;
  let swDev = false;
  try { swDev = localStorage.getItem('swDev') === '1'; } catch {}
  if (location.protocol !== 'https:' && !swDev) return;   // 手元の確認用サーバーでは使わない（古い版が残って紛らわしいため）
  let touched = false;
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => { touched = true; }, { once: true, passive: true }));
  navigator.serviceWorker.onmessage = e => {
    if (e.data?.type === 'page-updated' && !touched && performance.now() < 10000) location.reload();
  };
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // 保存分から表示した時は、新しい版が出ていないかサービスワーカーに確かめてもらう
  if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: 'check-update', url: location.href });
})();
